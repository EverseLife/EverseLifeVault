# Английские имена вещей мира (D-251, волна V).
#
# Оверлей поверх имён вольта: ключ — устойчивый `id`, значение — слово, каким
# его читает англоязычный игрок. Русское имя остаётся в своих файлах и языком
# вольта; здесь только второй язык, и сборка требует, чтобы у каждого id он
# был — иначе игрок прочтёт `iron_ore` посреди английской фразы.
#
# Регистр повторяет русский: товары, классы, операции, культуры и планеты — с
# заглавной, а слоты, тиры, типы зданий и свойства узлов — со строчной, потому
# что они стоят внутри фразы («ступень «отличное»», «каменный дом»).
#
# Написание американское, под стать идентификаторам: `fiber`, `sulfur`,
# `oxidizer`, `mineral_fertilizer` — и слово рядом с ними такое же.


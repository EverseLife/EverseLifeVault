# ЕДИНСТВЕННЫЙ ИСТОЧНИК восьми базовых культур Терры (D-057, D-105, D-136).
#
# Правится ТОЛЬКО здесь. Из этого файла генерируются:
#   20-systems/17-plant-catalog.md — страница для чтения
#   build/plants.json              — то, что читает движок
# Команда: python tools/build.py
#
# Замысел — почему культур восемь и что каждая держит на себе — живёт в
# 20-systems/14-plants-and-breeding.md и сюда не дублируется.
#
# Урожайность НЕ ЗАДАЁТСЯ. Она выводится сборкой из `harvest.rates` и длины
# цикла (D-136): час ухода за делянкой обязан стоить столько же, сколько час
# любого другого труда (И2). Задаются требования и характер — то, из чего
# складывается сложность выращивания.
#
# Формат записи:
#   id        — идентификатор для движка
#   name      — название культуры
#   wild_name — имя дикого предка: отдельный сорт, второй родитель (D-260)
#   gives     — что даёт. Обязано быть в `harvest.rates` и в сырье recipes.yaml
#   seed      — чем сеют. Отдельный предмет: семена покупаются, крадутся и
#               теряются при смерти, а агротехника — нет (D-057). Норма высева
#               `farm.seed_rate`, уборка возвращает семена кратно высеянному
#               (`farm.seed_return`, D-257)
#   byproduct — побочный выход, если есть
#   cycle     — длина цикла роста в сутках
#   requires  — что нужно от места и ухода:
#                 temp      {min, max} — диапазон температуры, °C
#                 water     1–3        — потребность в воде
#                 fertility 0–100      — требуемая плодородность
#                 light     1–3        — светолюбивость
#   traits    — характер:
#                 hardiness    1–5 — насколько прощает ошибки ухода
#                 disease_risk 1–5 — чувствительность к болезни
#                 density_risk 1–5 — чувствительность к загущению
#                 spoilage_k   ×   — множитель к `spoilage.food_base` для урожая
#   restores  — сколько плодородия культура ВОЗВРАЩАЕТ почве, % (только бобы)
#   feeding   — подкормка растущего (D-293): список {stage, fertilizer, growth}.
#               stage — фаза: sprout, leaf, bloom, fill; fertilizer — id вещи
#               класса «Удобрение»; growth — на сколько % быстрее растёт до
#               конца фазы. Всего, чего в списке нет, растение не прощает —
#               ожог farm.feed_wrong_burn. Порядок и фаза — то знание, ради
#               которого агротехника отделена от семян (D-057)
#
# Правило баланса (D-057): показатели и требования идут парой. Культура,
# хорошая во всём, существовать не должна — сборка это проверяет и ругается.

meta:
  decisions: [D-057, D-105, D-136]
  doc: 20-systems/17-plant-catalog.md
  design: 20-systems/14-plants-and-breeding.md
  # Нормировочная делянка, от которой считается урожайность (пример из 06-farming)
  reference_area: 100

plants:
  - id: spelt
    wild_name: Дикая полба
    seed: Семена полбы
    name: Полба
    gives: Зерно
    byproduct: Солома
    cycle: 6
    requires:
      temp: {min: 4, max: 28}
      water: 2
      fertility: 45
      light: 2
    traits: {hardiness: 4, disease_risk: 2, density_risk: 2, spoilage_k: 0.5}
    feeding:
      - {stage: sprout, fertilizer: compost, growth: 60}
      - {stage: leaf, fertilizer: mineral_fertilizer, growth: 100}
    note: Основа питания. Неприхотлива, средний цикл, солома идёт в корм и на подстилку

  - id: turnip
    wild_name: Дикая репа
    seed: Семена репы
    name: Репа
    gives: Овощи
    cycle: 4
    requires:
      temp: {min: 2, max: 24}
      water: 3
      fertility: 40
      light: 2
    traits: {hardiness: 3, disease_risk: 3, density_risk: 3, spoilage_k: 1.6}
    # Минеральное гонит корнеплод в ботву — для репы это ожог, а не корм
    feeding:
      - {stage: sprout, fertilizer: compost, growth: 80}
    note: Еда новичка. Быстрый цикл и много массы, но портится быстрее всех

  - id: beans
    wild_name: Дикие бобы
    seed: Семена бобов
    name: Бобы
    gives: Бобы
    cycle: 7
    requires:
      temp: {min: 12, max: 30}
      water: 2
      fertility: 30
      light: 2
    traits: {hardiness: 3, disease_risk: 2, density_risk: 2, spoilage_k: 0.6}
    restores: 15
    # Бобовые добывают азот сами: минеральное им — ожог
    feeding:
      - {stage: bloom, fertilizer: compost, growth: 60}
    note: Единственная культура, которая платит почве, а не берёт. Требует тепла

  - id: flax
    wild_name: Дикий лён
    seed: Семена льна
    name: Лён
    # Грядка даёт то же сырьё, что земля под ногами, — стебли (D-210). Волокно
    # из них вьют руками, и культура не вправе выдавать передел: урожайность
    # выводится из темпа сырья, а у передела темпа нет и быть не должно
    gives: Лён
    cycle: 11
    requires:
      temp: {min: 3, max: 20}
      water: 3
      fertility: 55
      light: 2
    traits: {hardiness: 2, disease_risk: 3, density_risk: 4, spoilage_k: 0.2}
    feeding:
      - {stage: sprout, fertilizer: compost, growth: 40}
      - {stage: leaf, fertilizer: mineral_fertilizer, growth: 80}
    note: Долгий цикл и капризность в обмен на всю лёгкую промышленность

  - id: camelina
    wild_name: Дикий рыжик
    seed: Семена рыжика
    name: Рыжик
    gives: Масличные семена
    cycle: 8
    requires:
      temp: {min: 6, max: 32}
      water: 1
      fertility: 20
      light: 3
    traits: {hardiness: 4, disease_risk: 2, density_risk: 2, spoilage_k: 0.4}
    feeding:
      - {stage: sprout, fertilizer: mineral_fertilizer, growth: 80}
      - {stage: leaf, fertilizer: compost, growth: 40}
    note: Культура окраин — терпит бедные и сухие земли, зато любит свет

  - id: sugarcane
    wild_name: Дикий сахарник
    seed: Семена сахарника
    name: Сахарник
    gives: Сахарный стебель
    cycle: 10
    requires:
      temp: {min: 14, max: 34}
      water: 3
      fertility: 75
      light: 3
    traits: {hardiness: 2, disease_risk: 4, density_risk: 3, spoilage_k: 0.5}
    # Жаден и к подкормке: два окна под минеральное — цена спирта
    feeding:
      - {stage: sprout, fertilizer: compost, growth: 60}
      - {stage: leaf, fertilizer: mineral_fertilizer, growth: 120}
      - {stage: fill, fertilizer: mineral_fertilizer, growth: 80}
    note: Жаден к почве и теплу, но открывает химию, спирт и ракетное топливо

  - id: stjohnswort
    wild_name: Дикий зверобой
    seed: Семена зверобоя
    name: Зверобой
    gives: Целебные травы
    cycle: 9
    requires:
      temp: {min: 5, max: 30}
      water: 1
      fertility: 15
      light: 3
    traits: {hardiness: 4, disease_risk: 2, density_risk: 2, spoilage_k: 0.3}
    # Зверобой не кормят: трава скудных земель, любое удобрение — ожог (D-293)
    feeding: []
    note: Растёт на скудных землях, выход мал. Вся медицина держится на нём

  - id: brome
    wild_name: Дикий кострец
    seed: Семена костреца
    name: Кострец
    gives: Сено
    cycle: 5
    requires:
      temp: {min: -2, max: 30}
      water: 1
      fertility: 10
      light: 1
    traits: {hardiness: 5, disease_risk: 1, density_risk: 1, spoilage_k: 0.3}
    # Ест что дают и когда дают: нетребовательность и здесь
    feeding:
      - {stage: sprout, fertilizer: compost, growth: 40}
      - {stage: sprout, fertilizer: mineral_fertilizer, growth: 60}
      - {stage: leaf, fertilizer: compost, growth: 40}
      - {stage: leaf, fertilizer: mineral_fertilizer, growth: 60}
    note: Страховка от неурожая — растёт почти везде, но кормит только скот

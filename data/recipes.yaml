# ЕДИНСТВЕННЫЙ ИСТОЧНИК списка рецептов MVP (D-052, D-054, D-057, D-060).
#
# Правится ТОЛЬКО здесь. Из этого файла генерируются:
#   20-systems/13-recipes-mvp.md — страница для чтения
#   build/recipes.json           — нормализованный список для движка
# Команда: python tools/build.py
#
# tools/build.py проверяет то, что документ обещает словами:
#   — нет циклов (верстак не требует гвоздей, которые делаются на верстаке)
#   — нет тупиков (каждый предмет потребляется, либо станок, либо часть постройки)
#   — каждый станок и вход существует как рецепт, операция или сырьё
#
# Формат записи:
#   name      — название предмета
#   inputs    — из чего делается
#   station   — на чём делается
#   kind      — item | station | building (станки и постройки выделяются в тексте)
#   highlight — входы, которые в тексте набраны жирным как узкое место ветки

meta:
  decisions: [D-052, D-054, D-057, D-060]
  doc: 20-systems/13-recipes-mvp.md
  # Сырьё: берётся из мира руками или добычей. Ничем не изготавливается.
  raw:
    - Волокно
    - Дерево
    - Камень
    - Глина
    - Вода
    - Смола
    - Солома
    - Зерно
    - Овощи
    - Мясо
    - Масло
    - Известняк
    - Кварцевый песок
    - Песок
    - Органические отходы
    - Соль
    - Сера
    - Селитра
    - Руда
    - Уголь
    - Вольфрам
    - Никель
    - Золотоносная порода
    - Серебряная порода
    - Энергия
    - Жила

  # Разговорное имя, которым текст пользуется, -> точное название
  synonyms:
    Медь: Медный слиток
    Железо: Слиток железа
    Печь: Плавильная печь

  # Класс инструмента -> чем его можно закрыть. Годится любой из списка
  tool_classes:
    Кирка: [Каменная кирка, Железная кирка, Стальная кирка]
    Топор: [Каменный топор, Топор]

# Расхождения, о которых мы знаем и по которым ещё нет решения.
# Проверка их показывает, но сборку не роняет. Каждое обязано ссылаться на OQ.
known_issues:
  - cycle: [Доски, Пила, Кузница, Брус, Верстак, Рукоять, Сталь, Топор, Дерево, Молот, Скобы, Гвозди, Слиток железа, Руда, Уголь, Камень, Кирка, Каменная кирка, Железная кирка, Стальная кирка, Каменный топор]
    oq: OQ-079
    note: >-
      Доски даёт только распил пилой, пила требует стали, сталь требует кузницы,
      кузница требует бруса, брус требует верстака, верстак требует досок.
      Стартовый тупик: лестница не проходится с нуля. Нужен ранний способ
      получить доски или брус без стального инструмента.

operations:
  - {name: Рубка дерева, requires: [Топор], gives: [Дерево]}
  - {name: Распил, requires: [Пила], gives: [Доски]}
  - {name: Добыча, requires: [Кирка, Жила], gives: [Руда, Камень, Уголь]}
  - {name: Дробление, requires: [Молот], gives: [Щебень, Крошка]}
  - {name: Плавка, requires: [Печь, Уголь], gives: [Слиток железа, Медный слиток, Олово, Свинец]}
  - {name: Обжиг, requires: [Печь], gives: [Керамика]}


      - {name: Сушёные овощи, kind: consumable, food: true, inputs: [Овощи], station: Очаг}
      - {name: Корм, kind: consumable, bulk: true, inputs: [Сено, Солома], station: Верстак}
      - {name: Одежда, kind: gear, slot: тело, inputs: [Ткань, Верёвка], amounts: {Ткань: 2, Верёвка: 1}, station: Верстак}

      - {name: Жаркое, kind: consumable, roles: true, food: true, hot: true, mass: 0.6, inputs: [Мясо, Овощи, Масло], station: Очаг}
      - {name: Отвар, kind: consumable, mix: true, inputs: [Целебные травы, Вода], station: Очаг}

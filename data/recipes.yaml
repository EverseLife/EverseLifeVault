      - {name: Стальная кирка, kind: tool, class: Кирка, inputs: [Сталь, Рукоять], amounts: {Сталь: 2, Рукоять: 1}, station: Кузница}
      - {name: Топор, kind: tool, class: Топор, inputs: [Сталь, Рукоять], station: Кузница}

    title: Земледелие и еда
    short: земледелие и еда
    recipes:
      - {name: Плуг, kind: tool, inputs: [Сталь, Дерево], station: Кузница}
      - {name: Серп, kind: tool, inputs: [Сталь, Рукоять], amounts: {Сталь: 0.5, Рукоять: 1}, station: Кузница}

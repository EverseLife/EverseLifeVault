      - {name: Броня, kind: gear, slot: тело, inputs: [Сталь, Ткань, Верёвка], station: Кузница, note: защита}
      - {name: Котёл, kind: tool, class: Утварь, inputs: [Медный слиток], station: Кузница, note: утварь}
      - {name: Труба, kind: material, inputs: [Сталь], amounts: {Сталь: 2}, station: Кузница}


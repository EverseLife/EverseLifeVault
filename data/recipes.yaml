# Расхождения, о которых мы знаем и по которым ещё нет решения.
# Проверка их показывает, но сборку не роняет. Каждое обязано ссылаться на OQ.
# Пусто: стартовый тупик OQ-079 закрыт бревном (D-084).
# Проверка это не ловит — она следит за связностью того, что есть,
# а не за полнотой того, что обещано другими документами.
known_issues: []

# Операции: то, что делается без рецепта.
#
#   requires — чем операция закрывается. Инструмент, станок, жила. НЕ расходуется
#   gives    — что даёт
#   consumes — что расходуется на единицу выхода. Пусто у добывающих операций:
#              рубка и добыча берут материю из мира, а не из другого предмета
#   weights  — доли бюджета труда между расходуемым, если равного деления мало
#   amounts  — количества, ЗАДАННЫЕ ВРУЧНУЮ: {выход: {вход: сколько}}. Исключение
#   yield    — {выход: сколько}. Сколько единиц выхода даёт ОДНА единица входа.
#              Для переделов, где выход мельче входа: бревно распускается на
#              несколько досок, и «сколько бревна на доску» — неестественная
#              форма записи. Задаёт количества напрямую: вход = 1 / yield
#
# Количества и время выводятся, а не задаются (D-133). Собственное время
# операции на единицу выхода — это `1 / harvest.rates[выход]`: там уже лежит
# темп по каждому из девяти продуктов операций. Дальше работает то же правило,
# что у рецептов: час работы съедает `craft.input_labor_ratio` часов чужого труда.
operations:
  # Бревно падает с дерева вместе с дровами: ранняя древесина не требует
  # стального инструмента, иначе лестница не проходится с нуля (D-084)
  - {name: Рубка дерева, requires: [Топор], gives: [Дерево, Бревно], consumes: []}
  # Распил — единственный передел, где выход мельче входа. Вывод из трудоёмкости
  # давал 0.6 бревна на доску, а пол «меньше единицы не бывает» выкручивал это
  # в 1.0, и бревно давало ровно одну доску. Число 5 — ПРОБНОЕ, ручка выхода
  # древесины: им регулируется, насколько дефицитны доски на старте
  - {name: Распил, requires: [Пила], gives: [Доски], consumes: [Бревно], yield: {Доски: 5}}
  - {name: Добыча, requires: [Кирка, Жила], gives: [Руда, Камень, Уголь], consumes: []}
  - {name: Дробление, requires: [Молот], gives: [Щебень, Крошка], consumes: [Камень]}
  # Уголь здесь топливо и потому расходуется, а не «требуется»: печь остаётся,
  # уголь сгорает. Руда до этого нигде не значилась входом — плавка была
  # единственным переделом, у которого не было сказано, из чего он делает металл.
  # Вес 0.8/0.2: топливо не стоит половины плавки, иначе руды и угля уходит
  # поровну и передел перестаёт читаться как обогащение (D-141)
  - {name: Плавка, requires: [Печь], gives: [Слиток железа, Медный слиток, Олово, Свинец],
     consumes: [Руда, Уголь], weights: {Руда: 0.8, Уголь: 0.2}}
  - {name: Обжиг, requires: [Печь], gives: [Керамика], consumes: [Глина]}


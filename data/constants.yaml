          по ней идёт (`hydro.discharge`), и озером считается впадина, в
          которую втекает; лёд опустился в порядке форм с третьего места
          почти на последнее — он вещество, а не форма, и хребты подо льдом
          снова видны. Площади ужаты второй раз: три обжитых мира по 1 946
          км², Пироксис 648.

          Версия 7 — 2026-09-11: у Авроры появились замёрзшие моря, растр
          льда лёг и на морскую воду холоднее `terrain.ice_c` (Терре это
          дало полярные припаи, которых у неё не было вовсе), и завёлся
          отдельный растр растительности `plants` — зелёный цвет на карте
          берётся теперь только из него.

          Версия 8 — 2026-09-11: реки перестали быть векторами и приехали
          растром `stream` — долей клетки под руслом, которую клиент режет
          между клетками, как озеро. Ширина ленты бралась тогда у расхода,
          поэтому у истока река была узкой, а после каждого слияния шире.
          Версия поднята не ради картинки: растр **новый**, и поле версии 7
          приехало бы в игру без него — движок подставил бы нули, и рек на
          карте просто не стало бы, молча. Ровно от такого паспорт и
          сторожит.

          Версия 9 — 2026-09-11: ширина ленты считается не расходом, а по
          дереву стока, и слияние берёт `terrain.river_merge` долю суммы
          ширин вместо суммы (владелец). Закон `k·√A` снят вместе со своей
          константой; большие реки от этого стали много уже, а исток остался
          на полу, который держит сетка. Версия 10 — 2026-09-11: захват
          русла (`hydro.capture`): русло, в пяти клетках от которого течёт
          русло крупнее и ниже, отдаёт ему воду, а перемычка прорезается в
          высоте. Спуск по самому крутому уклону вёл параллельные русла к
          морю двумя устьями в двухстах метрах друг от друга (владелец:
          «реки не сливаются, хотя там логично что они сливаются»). Той же
          версией мера ленты реки (`stream`) стала расстоянием до берега на
          пологом склоне (`pipeline.STREAM_RAMP_M`), а не долей ширины:
          крутая мера между клетками русла по диагонали резалась в чётки.
          Версия 11 — 2026-09-11: берег по основе (`pipeline._shore_by_base`,
          `_shore_profile`): в полосе трёх клеток от кромки высота сводится
          к профилю основы в одном масштабе с обеих сторон, и ноль картинки
          между клетками стоит там, где основа пересекает уровень, а не на
          серединах крайних клеток суши; насыпная кромка — клетки моря,
          поднятые эрозией до суши, половина первого кольца Терры, — идёт
          по сглаженному фронту класса (`pipeline.FRINGE_BLUR`), потому что
          основа у неё под уровнем; и схождение плит, разошедшееся по
          плите, размыто (`plates.CONVERGENCE_BLUR`) — без этого швы областей
          Вороного клеток границы несли в рифт и хребет ступени по решётке,
          и кромка моря шла по ним прямыми под сорок пять градусов
          (владелец: «на карте встречаются ромбы»).
          Побочное, замером v7 → v11 на Терре: обрывы `cliff` 207 → 3 и
          `coast_cliff` 6082 → 4373 — они жили на швах Вороного и на
          сплющенной кромке (OQ-167); десяток клеток русла в первом кольце
          стоит выше соседа вверх по течению — сток считан до профиля, и
          лестница `filled` от этого не меняется.
          Версия 12 — 2026-09-12 (D-331): линия русла сглажена перед лентой
          (`hydro.smooth_channel`, `CHANNEL_SMOOTH`) — на ближних кадрах
          река идёт дугой, а не коленом; долины по расходу
          (`pipeline._carve_valleys`, `terrain.valley_depth_m`,
          `terrain.valley_width_m`, озёра не роются); потолок ширины 200 м;
          клетка русла читается стоящей на линии (пол меры ленты)
          Версия 13 — 2026-09-12 (D-335 п. 7): влага марша перемешивается
          между кольцами широты (`climate.MERIDIONAL_MIX`, `_mixed`) — снята
          прямая черта по параллели на осадках и облаках; растры Пироксиса
          не изменились (дождя там нет).
        decision: 90-production/12
      - key: terrain.ice_c
        value: -8
        unit: "°C"
        note: >-
          Ниже этой средней температуры земля подо льдом: шапка, где вода не
          режет, а лёд выпахивает (план §4.2, §4.9). Отдельно от порога
          тундры в `biome.zonal`: тундра остаётся тундрой,
          а лёд начинается там, где мерзлота, — владелец 2026-09-09: лёд от
          порога тундры накрывал четверть суши и был скучен. При
          `site.temp_range` −15…35 линия льда на уровне моря — около 68°
          широты вместо 60°
        decision: 90-production/12
      - key: terrain.ice_cap_c
        value: {terra: -8, aquatica: -8, pyroxis: -8, aurora: -68}
        unit: "°C"
        note: >-
          Ниже этой средней мокрая земля ложится под шапку — свой порог у
          планеты. У трёх миров он равен `terrain.ice_c`; у Авроры, холодной
          везде (−25 °C на экваторе), общий порог клал лёд на всю сушу, и
          строить и сеять там было бы негде (D-338): владелец 2026-09-13 —
          «убрать лёд с Авроры, лёд оставить на полюсах, пусть Аврора будет
          в снегу». При −68 и `terrain.ice_deep_c` −78 шапка Авроры на
          пересобранном поле — 9,2 % суши в среднем на 68,5° широты и ни клетки
          южнее 45,6°, как у Терры (8,5 %). Реки и эрозия по-прежнему мёрзнут по `terrain.ice_c`
        decision: D-338
      - key: terrain.ice_rain
        value: 0.25
        unit: доля осадков
        note: >-
          Лёд растёт там, где холодно **и** мокро: ниже этой доли осадков
          (шкала поля 0…1) холодная земля остаётся сухой мерзлотой — тундрой
          и полярной пустыней без шапки, как Якутия при −10 °C. Владелец
          2026-09-09: сплошной лёд по всему холоду скучен; так шапка ложится
          на влажные берега и горы, а сухие полярные равнины остаются землёй
        decision: 90-production/12
      - key: terrain.ice_deep_c
        value: {terra: -20, aquatica: -20, pyroxis: -20, aurora: -78}
        unit: "°C"
        note: >-
          Ниже этой средней земля подо льдом при любой сухости — сердце шапки.
          Своё у планеты с D-338: Аврора холоднее −20 вся, и сердце её шапки —
          только у полюсов
        decision: 90-production/12
      - key: terrain.continental_c
        value: 5
        unit: "°C"
        note: >-
          На столько глубина материка холоднее берега той же широты (в
          полурадиусе планеты от моря — вся величина, у экватора втрое
          слабее): без этого температура — чистая функция широты, и биомы
          ложатся ровными полосами (владелец 2026-09-09)
        decision: 90-production/12
      - key: terrain.climate_noise_c
        value: 5
        unit: "°C"
        note: >-
          Размах местных отклонений средней температуры — течения, заливы,
          всё, чего у модели нет поимённо: ±5 °C шумом в десятки километров
          (на Земле два берега одного моря расходятся на столько), чтобы
          границы биомов гуляли, а не шли по параллели
        decision: 90-production/12
      - key: terrain.climate_noise_km
        value: 2.5
        unit: км
        note: >-
          Длина волны местного шума климата — размер пятна тёплого или
          холодного берега. 20 → 5 при ужатии планет 2026-09-10: пятно
          мерится планетой, а не абсолютом (`noise.lattice_for` кладёт длину
          волны на радиус), и на экваторе в 156 км пятно в 20 км было бы
          шестой частью полушария вместо прежней тридцатой. Делится на
          корень из шестнадцати, как и всё, что мерялось долей радиуса.
          5 → 2,5 второй волной (D-329): площадь ещё вчетверо, радиус вдвое
        decision: 90-production/12
      - key: terrain.continental_reach_r
        value: 0.5
        unit: доля радиуса
        note: На каком удалении от моря глубина материка холодеет на всю `terrain.continental_c`
        decision: 90-production/12
      - key: terrain.wind_belts
        value: {trade_lat: 30, westerly_lat: 60, edge_deg: 8}
        unit: "°"
        note: >-
          Пояса ветров: до `trade_lat` пассаты на запад, до `westerly_lat`
          западные на восток, дальше полярные восточные; на `edge_deg` по
          краю пояса осадки двух маршей влаги смешиваются, чтобы смена ветра
          не шла по одной параллели. По тем же поясам с D-336 идут облака:
          `trade_lat` и `westerly_lat` читает и движок (`climate.wind_west`),
          а полоса смешения облаков — своя, шире (`weather.belt_edge_deg`)
        decision: 90-production/12
      - key: terrain.dry_belt_wander_deg
        value: 8
        unit: "°"
        note: На сколько край сухого пояса гуляет по долготе шумом
        decision: 90-production/12
      - key: terrain.rain_noise
        value: 0.3
        unit: доля
        note: Доля шума в осадках места — рваность границ сухого и мокрого, подобрана по рендеру
        decision: 90-production/12
      - key: terrain.dry_belt_lat
        value: 27
        unit: "°"
        note: >-
          Широта середины сухого пояса — нисходящего воздуха ячейки Хэдли
          (план §4.2): здесь ложатся пустыни на подветренной стороне. Пустыню
          от степи делит не широта, а тепло и сушь в `biome.zonal` (волна 4):
          прямой черты через материк нет
        decision: 90-production/12
      - key: terrain.dry_belt_width
        value: 10
        unit: "°"
        note: Полуширина сухого пояса по широте; край пояса гуляет по долготе шумом
        decision: 90-production/12
      - key: terrain.dry_belt_strength
        value: 0.4
        unit: доля
        note: На сколько сухой пояс ослабляет дождь в своей середине
        decision: 90-production/12


          12 → 24: правка владельца через редактор вольта 2026-09-10, в
          тот же вечер, когда он попросил добавить вулканов. Довод здесь не
          записан — записано, что число его, а не выведено. Следствия видны в
          собранных полях и стоят того, чтобы их назвать: конусы стоят по
          дуге над зоной погружения, и вдвое больше плит — вдвое больше дуг,
          то есть вулканов прибавляет наравне с `terrain.volcanoes`. Речная
          сеть Терры от этого стала гуще, а не реже: 2,8 % клеток против
          прежних 1,6 — больше хребтов, больше и водосборов между ними
      - key: terrain.continental_share
        value: 0.5
        unit: доля плит
        note: >-

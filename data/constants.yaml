          средней годовой в −5 держится мох и стланик, но не покров;
          +32 °C — выше жара сушит быстрее, чем поливает дождь, и зелень
          остаётся только у воды. Края взяты внутри земного диапазона
          `terrain.temp_range` Терры (−15…35), чтобы у неё были и голая
          тундра, и выжженная пустыня, а не сплошной луг. Пироксис (27…120)
          задевает полосу лишь самым холодным краем, Аврора (−93…−25) не
          задевает вовсе — обе выходят без зелени арифметикой, а не
          оговоркой про планету
        decision: D-329
      - key: terrain.plant_rain
        value: 0.45
        unit: доля шкалы осадков
        note: >-
          При какой доле шкалы `site.rain_range` воды покрову уже вдоволь:
          выше неё зелень гуще не становится. Насыщение, а не потолок дождя.

          Взято не подбором: 45 — тот самый край, за которым в `biome.zonal`
          начинается лес (строки `cool_wet` и `mild_wet`), так что число
          означает «дождя как в лесу» и держится за таблицу, а не за вкус.
          Насыщать необходимо: покров — произведение тепла, воды и опоры, и
          без насыщения три множителя меньше единицы дают в произведении
          ничтожество. Первая версия считала так и выдавала умеренному лесу
          Терры покров в пять процентов при том, что каждый сомножитель по
          отдельности выглядел разумно.

          Замер на Терре при 0,45: средний покров суши 28 %, гуще половины
          31 % суши, голой земли 43 %. При 0,35 — 30 / 33 / 43, при 0,55 —
          27 / 28 / 44: в этих пределах число почти ничего не решает, потому
          что покров упирается не в дождь, а в тепловую полосу
        decision: D-329
      - key: terrain.mountain_share
        value: 0.15
        unit: доля суши
        note: Столько суши выше горной черты. В горах узел чаще несёт жилу (`biome.vein_k` горного биома, D-321), а лес до черты не доходит
        decision: D-319
      - key: terrain.lapse_c
        value: 19.5
        unit: "°C"
        note: >-
          На столько холоднее у вершины подъёма суши, чем у его подножия;
          широта даёт остальное между краями `site.temp_range`. Было 12 при
          неявных 1850 м размаха; с `terrain.relief_m` = 3000 это стало 19,5,
          то есть те же земные 6,5 °C/км (план ландшафта 90-production/12
          §11: правится вместе с размахом, а не молча). В градусы на километр
          ключ переведёт волна климата.

          2026-09-10 размах ужался до 750 м, а 19,5 осталось — и это правка
          вместе с размахом, а не молчание. Ключ мерит перепад **по всему
          подъёму**, а не по километру, и от него живёт весь высотный пояс:
          альпика, снежник, граница леса. Пойти за земным градиентом значило
          бы 4,9 °C на весь подъём — вершина теплеет на пятнадцать градусов,
          и горного климата на планете просто не остаётся. 26 °C/км против
          земных 6,5 — условность того же рода, что и сама планета в 25 км
          радиусом: D-324 объявляет землю под ногами условностью, а не
          физикой, и градиент был земным только пока радиус был поводом так
          считать
        decision: D-319
      - key: terrain.relief_m
        value: 375
        unit: м
        note: >-
          Размах рельефа: от уровня моря до высшей вершины планеты. Поле
          читает высоту долей этого подъёма, и метры у горизонталей,
          горизонта и уклона берутся отсюда (план ландшафта 90-production/12,
          волна 1; владелец 2026-09-09: три километра; расчёт по температуре
          и горизонту рекомендует четыре). Раньше число было неявным: 12 °C
          `terrain.lapse_c` при земном градиенте давали около 1850 м.

          Владелец 2026-09-10, при ужатии планет: ужимается вместе с
          планетой, оптимальное значение посчитать самому. Оптимум — деление
          на корень из того, во сколько ужата площадь: при шестнадцати это
          3000 → 750, и он же выходит из двух независимых мерок сразу. **Доля
          радиуса**: 3000 м были 3,014 % радиуса Терры, 750 м — те же 3,014 %
          нового; гора остаётся той же горой относительно шара. **Склон**:
          формы рельефа задаются шумом на единичной сфере
          (`tools/field/noise.py` — решётка поперёк диаметра), то есть держат
          свой угловой размер, а не метровый. Хребет, лежавший поперёк N
          клеток, ложится теперь поперёк 1,99N (nside 256 → 509), значит
          перепад на клетку падает вдвое, а клетка — в 7,96; склон вырос бы
          вчетверо, и вся суша встала бы дыбом. Деление размаха на те же
          четыре возвращает каждый склон к прежнему градусу.

          2026-09-10, вторая волна ужатия (D-329): площадь ещё вчетверо,
          радиус вдвое, размах 750 → 375 — тот же счёт и тот же довод. Доля
          радиуса держится: 750 м были 3,014 % прежнего радиуса Терры, 375 —
          те же 3,014 % нынешнего. Владелец про рельеф во второй раз ничего
          не говорил; он и не должен — правило записано здесь первой волной, и
          молчаливым было бы как раз **не** ужать: мир вышел бы вдвое круче
          заказанного, а обрывы перекрыли бы дороги, которых никто не просил
          перекрывать (D-319)
        decision: 90-production/12
      - key: terrain.step_m
        value: 50
        unit: м
        note: >-
          Сторона клетки поля в метрах — одна на все планеты, у всех клеток
          планеты одна и та же (план ландшафта §4.1, D-328; владелец
          2026-09-09: сетка в метрах, у всех планет одинаковый размер ячеек,
          иначе теряется масштаб). Из неё выводится дробность каждой планеты
          на равноплощадной сетке HEALPix: nside = round(R·√(π/3)/step) —
          255 у Терры, Акватики и Авроры, 147 у Пироксиса, и сторона клетки
          выходит 49,9–50,0 м у всех четырёх. Прежние 500 м были
          шагом квадратной сетки, у которой клетка сжималась косинусом
          широты: у полюса она была вдесятеро уже экваториальной, отчего и
          шла полярная рябь (§4.9).

          Владелец 2026-09-10: 50 м вместо 398. Пятьдесят метров — это
          участок (`explore.node_area` даёт сторону 11–25 м), то есть поле
          перестало быть подкладкой под места и стало землёй, по которой они
          стоят: под городом D-323 с его семиметровым кольцом теперь не одна
          клетка на весь город, а тридцать.

          Цена после первого ужатия была 13,5 млн клеток на четыре планеты и
          час с лишним сборки; после второго (D-329) — **2,60 млн**: по 780
          тысяч у трёх обжитых миров и 259 тысяч у Пироксиса, 83 МБ в памяти
          сервера и минуты на планету. Картинка берёт из поля копию погрубее
          (`runtime.RASTER_CELLS_MAX`), и на этих размерах она почти совпала
          с полем: 254 против 255 у трёх (клетка та же, с точностью до
          сотых), 126 против 147 у Пироксиса (клетка в 1,17 раза крупнее).
          До ужатия у Терры было 254 против 509 — клетка картинки вдвое
          грубее поля, — и это исправилось само, а не расчётом
        decision: 90-production/12
      - key: terrain.plates

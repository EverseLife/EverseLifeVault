          Сколько суши всего, решает не это, а `terrain.sea_level`
        decision: 90-production/12
      - key: terrain.river_area_km2
        value: 0.3125
        unit: км²
        note: >-
          Сколько площади должно стекать через клетку, чтобы там читалась
          река: реки теперь не рисуются нитками, а сливаются из стока (план
          §4.2), и это порог между ручьём и рекой. Заменил **terrain.rivers**

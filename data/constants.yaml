          ландшафта §5, волна 4): средняя температура, °C, и осадки по
          шкале `site.rain_range`; нижний край входит, верхний нет,
          кроме самого верхнего. Сборка вольта проверяет, что прямоугольники
          покрывают всю шкалу осадков и температуры с запасом на высоту,
          глубину материка и местный шум без дыр и наложений: точка без
          класса — узел без биома, точка с двумя — тот же порядок веток,
          что был лестницей `if`. Новая строка — новый
          класс без правки кода. Числа — стартовая калибровка по земной
          диаграмме, правятся по переписи поля.

          **Мёртвые края, 2026-09-10 (D-329).** Владелец, увидев рендеры:
          «на пироксисе и авроре зелень, так быть не должно. зелень должна
          расти в комфортных температурах». Причина была не в планетах, а
          здесь: таблица кончалась на −60 и +60, а точка за её краем
          **прижималась к краю** — Пироксис при +120 °C читался как жаркий
          пояс, и с любой каплей осадков давал саванну и лес. Прижатие само
          по себе правильно (лучше край, чем узел без класса), но края
          обязаны быть мёртвыми, а не зелёными. Заведены две строки без
          растительности: `dead_cold` — ледяное поле ниже −25 °C (холоднее
          любой земной тундры: в глубине Антарктиды −50), и `molten` —
          чёрное поле выше +60 °C. Между ними всё как было. Терра задевает
          только холодный край, полярной каймой; Аврора лежит в нём целиком,
          Пироксис — в горячем
        decision: D-321
      - key: biome.azonal
        value: {ridge: alpine, cliff: alpine, scree: alpine, volcano: alpine, glacial: alpine, canyon: foothills, hills: foothills, fan: foothills, floodplain: floodplain, delta: floodplain, valley: floodplain, beach: coast, coast_cliff: coast, fjord: coast, dunes: desert, ice: ice}
        note: >-
          Азональный слой (план §5): форма рельефа из поля, которая бьёт
          климат, — форма → биом. Форма без строки читается зонально по
          `biome.zonal`. Выше всего — горная черта поля (`terrain.mountain_share`)
          и лёд поля: они читаются раньше таблицы. Болото и берег без формы —
          по `biome.bounds`. Каменистая пустыня (`rocky_desert`) строки не
          имеет намеренно: в холоде она читается зонально, дюны — всегда пустыня
        decision: D-321
      - key: biome.facet_axes
        value: {wave_m: 50, slope_full: 0.2, wet_km: 0.5, patch_km: 0.125, soft_edge: 0.25, favour_k: 2.5}
        note: >-
          Оси, по которым выбирается фацет — грань биома, в которой стоишь
          (план ландшафта §6, словарь 10-world/08; строки — `data/facets.yaml`).
          `wave_m` — сторона клетки мозаики, 50 м — клетка поля (дополнение
          к D-321 от 2026-09-18). Оно мерится расстоянием между находками, а
          не радиусом планеты, и ужатия планет его не двигают: на волне D-329
          его сгоряча поделили на два вместе с длинами ландшафта и вернули
          (п. 18). До
          2026-09-18 стояло 200: обещание владельца 2026-09-09 «две находки в
          трёхстах метрах читаются по-разному, в двадцати — обычно одинаково»
          пары держали, но мерило оно не то. Разведчик шагает на 5–100 м
          (`biome.reach_m`), первые десятки находок от города ложатся в сотню
          метров — в несколько клеток мозаики, и у столицы Терры бросок всех
          их выпал на «Прибрежный лес» (владелец 2026-09-18: «все
          узлы приобретают свойства „прибрежный лес“»): в кольцах 10–100 м
          вокруг ядра — 46 точек из 47. При 50 м там шесть лиц, самое частое
          — 12 из 47; из сорока колец
          20–100 м вокруг точек суши в одно лицо одно (было семь); обещание
          2026-09-09 держится с обеих сторон: в трёхстах метрах совпадают
          28 % пар (было 24 %), в двадцати — 68 % (было 83 %), то есть
          по-прежнему обычно. Мельче клетки поля не спускать (сборка
          отказывает, если `wave_m` меньше `terrain.step_m`): крутизна, влага и высота читаются по ней, мельче
          они только интерполируют себя, и лицо стало бы броском кости на
          каждой находке, а не пятном земли. Обе стороны держит
          `test_facet.py`. Остальные три
          откалиброваны по тому, что даёт поле, иначе коробки словаря
          недостижимы и доли не работают, и с ужатием пересчитаны по новому
          полю: `slope_full` 0,2 — уклон в метрах на метр, считающийся
          единицей крутизны (медиана суши Терры 0,027 против прежних 0,016 —
          мерка сменилась с 500-метровой клетки на 50-метровую, а не земля;
          0,2 в обоих мирах лежит в самом хвосте); `wet_km` 0,5 — дальше
          этого близость воды нуль; `patch_km` 0,125 — пятно, внутри которого
          меряется высота точки: 0 — дно ложбины, 1 — макушка бугра. Обе —
          длины ландшафта, и обе делятся на то же, на что делится радиус: при
          первой волне 4 → 1 и 1 → 0,25, при второй (D-329) ещё вдвое. Как
          доля радиуса Терры они не двигались с самого начала: `wet_km` — 4 %,
          `patch_km` — 1 %.

          **`wet_km` обязан помещаться под потолок растра расстояний**
          (`pipeline.WET_MAX_R`, доля радиуса), и не своей планеты, а **самой
          мелкой**: порог в метрах один на все миры, а потолок у каждого свой.
          На второй волне 500 м оказались выше потолка Пироксиса (359 м), и
          вся его суша читалась «у воды», а ось влаги в выборе фацета не
          принимала нуля нигде. Потолок поднят до 10 % радиуса — тем же
          правилом мерится и `biome.bounds.coast_km`. `soft_edge` — насколько далеко за своей коробкой
          фацет ещё встречается: коробки словаря нарисованы рукой и не мостят
          куб, да и земля одного биома не расходится по всему кубу (в лесу
          нигде не круто), поэтому коробка — не ворота, а склонность: внутри
          неё фацет берёт всю свою долю, за ней тает. Числа мира, а не
          картинки: от них зависит, какой фацет достанется узлу, а с ним метки
          места, шанс жилы, дальность разведки и суточный размах. `favour_k` —
          во сколько раз чаще встречается фацет, который провинция любит
          (`favours` в `data/provinces.yaml`, план §7): «Рудный кряж» узнаётся
          по осыпям и скальникам, а не только по подписи
        decision: D-321
      - key: biome.bounds
        value: {wet: 38, coast_km: 0.375, marsh_relief: 0.15}
        note: "Пороги азонального слоя, у которых нет формы: осадки выше wet в низине ниже marsh_relief — болото; берег — ближе coast_km к морю. Холод, сушь и широта пустыни ушли в `biome.zonal` (волна 4), предгорье и горы — в `biome.azonal` и горную черту поля"
        decision: D-321
      - key: complex.chance
        value: {aurora: {snow: 20}, terra: {floodplain: 15, alpine: 15, desert: 10}}
        unit: "% находок"
        note: Как часто находка — комплекс, по планете и биому исходного узла
        decision: D-321
      - key: complex.schemes
        value:
          forerunner_mine: {planet: aurora, biome: snow, weight: 6, nodes: [{role: shaft, name: Ствол шахты, vein: true}, {role: store, name: Склад руды, finds: склад}, {role: store, name: Склад руды, finds: склад}, {role: hall, name: Зал, finds: архив}]}
          forerunner_outpost: {planet: aurora, biome: snow, weight: 3, nodes: [{role: hall, name: Зал, finds: архив}, {role: quarters, name: Квартира, finds: квартира}, {role: quarters, name: Квартира, finds: квартира}]}
          lost_city: {planet: aurora, biome: snow, weight: 1, city: true}
          river_bend: {planet: terra, biome: floodplain, weight: 1, nodes: [{role: ford, name: Брод, ford: true}, {role: fishing, name: Рыбное место, water: river}]}
          mountain_pass: {planet: terra, biome: alpine, weight: 1, nodes: [{role: saddle, name: Перевал}, {role: slope, name: Склон, vein: true}]}
          oasis: {planet: terra, biome: desert, weight: 1, nodes: [{role: spring, name: Источник, water: river}, {role: grove, name: Пальмовая роща, woods: true}]}
        note: "Схемы комплексов: узлы схемы встают на решётку рядом с найденным по тем же правилам места, содержимое склада — по `ruins.room_finds`; `lost_city` — город Предтеч D-232 со всеми помещениями, открытыми с рождения (заменяет `ruins.lost_cities`)"
        decision: D-321
  - id: promised

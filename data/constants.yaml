          В той же версии починена эрозия: коэффициент диффузии склона растёт
          квадратом дробности сетки, и на клетке в 50 м явная схема пошла
          вразнос — первые сборки версии 5 вышли плоскими. Длина оплывания
          ужата вместе с ландшафтом, а шаг диффузии дробится по устойчивости

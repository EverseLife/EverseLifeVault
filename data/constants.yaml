        value: 30
        unit: м
        note: >-
          На сколько самая полноводная река планеты опускает своё русло в
          долину (`pipeline._carve_valleys`, D-331); прочие — на долю корня
          из своего расхода. Ноль — без долин. Владелец 2026-09-12: «реки
          размывают ландшафт, чтобы они выглядели правильнее»
        decision: D-331
      - key: terrain.valley_width_m
        value: 600
        unit: м
        note: >-
          На сколько метров в стороны от русла сходит на нет долина самой
          полноводной реки; у прочих — от трети до всей ширины по расходу.
          Земля в долине опущена по параболе от русла к краю
        decision: D-331
      - key: terrain.capture_reach_m
        value: 250
        unit: м
        note: >-
          Досягаемость захвата русла (`hydro.capture`, план ландшафта §17):
          русло, не дальше этого от русла крупнее и ниже, отдаёт ему воду,
          а перемычка между ними прорезается в высоте. Спуск по самому
          крутому уклону кладёт на ровный склон параллельные русла и сам их
          не сводит: на Терре две реки шли в 130–250 м друг от друга и
          впадали в один залив двумя устьями (владелец 2026-09-11: «реки не
          сливаются, хотя там логично что они сливаются»). Пять клеток при
          шаге 50: у двух-пяти клеток между руслами и стоит их
          параллельность; конвейер переводит метры в клетки сам. Русло тут
          мерится расходом — той же мерой, что `terrain.river_area_km2`
        decision: 90-production/12
      - key: terrain.river_narrow_m
        value: 60
        unit: м
        note: >-
          Ширина истока, она же пол ленты. Свойство **сетки**, а не воды, и
          предел этот выведен из того, **как ленту читают**.

          Игра берёт меру ленты между клетками и режет по половине. Мера
          (`pipeline.ribbon`) — расстояние до линии русла против полуширины
          на склоне `STREAM_RAMP_M` = 200 м: `0,5 + (W/2 − gap)/200`. Русло
          шагает по клеткам, и у диагонального шага боковая клетка стоит в
          35,4 м от линии; между двумя клетками русла интерполяция даёт
          среднее четырёх. По этой арифметике 60-метровая лента на диагонали
          выходит 59–61 м — без перехватов; 50-метровая — уже около 45 в
          перехвате при 50 в клетках русла; 40-метровая — около 25 против 40.
          Пол «чёток» теперь задают склон меры и диагональный отступ, а не
          «одна клетка», как при прежней крутой мере (2026-09-11).

          Отсюда и ответ на «сделать реки сильно уже» (владелец 2026-09-11):
          до 50 м лента ещё держится, ниже — рвётся на диагоналях; реки по
          десять-двадцать метров — не правка числа, а более дробное поле. 60
          — первое круглое число с запасом.

          **Снимок вольта тут врёт в худшую сторону**: он красит клетку
          целиком и потому показывает чётки там, где игра рисует ленту.
          Сверять ширину надо в игре.

          С версии 12 линия русла под ленту сглажена (`hydro.smooth_channel`)
          и отходит от середины клетки до трети клетки; чтобы запас у ножа
          не ушёл, клетка русла читается как стоящая на линии (пол меры в
          `pipeline`), и арифметика выше держится для неё; между клетками
          лента идёт дугой и во внутреннем углу уже на пятую долю клетки
        decision: 90-production/12
      - key: terrain.river_wide_m

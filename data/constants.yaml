# ЕДИНСТВЕННЫЙ ИСТОЧНИК всех числовых значений игры (D-065).
#
# Правится ТОЛЬКО здесь. Из этого файла генерируются:
#   30-economy/07-constants.md — страница для чтения
#   build/constants.json       — плоская карта, которую читает движок
# Команда: python tools/build.py
#
# Требование дизайна: ни одна из этих величин не зашита в код
# (90-production/01-tech-notes.md, D-065). Изменение константы применяется
# к миру немедленно или со следующего тика, без выката новой версии.
#
# Формат записи:
#   key      — идентификатор, по которому значение достаёт движок
#   value    — число, строка, или диапазон {min, max}
#   unit     — единица измерения (необязательно)
#   note     — смысл величины для человека (необязательно)
#   decision — D-XXX, если значение зафиксировано решением, а не подобрано
#   formula  — вместо value, если это не число, а правило пересчёта

meta:
  decision: D-065
  doc: 30-economy/07-constants.md
  telemetry: 60-meta/04-metrics.md

groups:
  - id: anchors
    title: Якоря
    constants:
      - key: energy.body_print
        value: 1000
        unit: энергии
        note: Энергии на печать одного тела
        decision: D-033
      - key: mining.iron_per_hour
        value: 60
        unit: ед./час
        note: Единиц железной руды за час активной добычи средним инструментом

  - id: energy
    title: Энергия
    constants:
      # Теплотворность — свойство материала (D-215): числа в реестре
      # материалов, поле `fuel`. У чего поле есть, то и жгут; прежняя
      # `energy.per_coal` (50 у угля) переехала туда без изменения числа
      - key: energy.fuel_energy
        value_from: materials
        unit: энергии/ед.
        note: Выход энергии с единицы топлива, по каждому горючему материалу
      - key: energy.waterwheel_rate
        value: 30
        unit: в час
        note: Топлива не требует
      - key: energy.windmill_rate
        value: {min: 0, max: 40}
        unit: в час
        note: Зависит от погоды
      - key: energy.coal_plant_rate
        value: 200
        unit: в час
        note: При расходе 4 угля в час
      - key: energy.coal_plant_fuel_draw
        value: 4
        unit: угля/час
      # Ток борта (D-288): там, где пула нет — в полёте и на безвоздушной
      # земле, — выработка идёт в заряд аккумуляторов корпуса. Панель плоская:
      # расстояние до звезды не считается, пока нет причины
      - key: energy.solar_rate
        value: 10
        unit: в час
        note: «Солнечная панель». Топлива не требует; хватает автомату (auto.energy_per_hour = 6) с запасом на зарядку
        decision: D-288
      - key: energy.isotope_rate
        value: 40
        unit: в час
        note: «Изотопный генератор» — пироксисовый тир, без топлива. Малый корабль живёт на одном
        decision: D-288
      - key: energy.battery_capacity
        value: 500
        unit: энергии
      - key: energy.battery_mass
        value: 15
        unit: кг
      - key: energy.battery_selfdischarge
        value: 2
        unit: "% в сутки"
      - key: energy.deep_mine_draw
        value: 20
        unit: в час
        note: Освещение, откачка, вентиляция
      - key: energy.biopr_idle_draw
        value: 5
        unit: в час
        note: Поддержание готовности биопринтера
      - key: energy.home_draw_per_m2
        value: 0.2
        unit: в час на м²
        note: Быт — свет, тепло, вентиляция. Берётся с площади застройки (D-135)
        decision: D-135
      - key: energy.meter_period
        value: 24
        unit: часа
        note: Как часто выставляется счёт по счётчику. Не заплатил — здание отключено
        decision: D-135
      - key: energy.hearth_fuel_per_hour
        value: 3
        unit: дров/час
        note: Очаг топится дровами, а не сетью — еда должна готовиться и вне города
        decision: D-135
      - key: energy.tariff_default
        value: 5
        unit: ТК/100 энергии
        note: Тариф нового города до первого решения устава; город вправе поставить ноль
        decision: D-085

  # Выносливость киборга (D-091): потолка суток нет, темп выбирает игрок
  - id: body
    title: Выносливость
    constants:
      - key: body.stamina_max
        value: 100
        unit: ед.
        note: Запас тела. Потолка на сутки нет — есть цена темпа
        decision: D-091
      - key: body.drain_rate
        value: {min: 5, max: 40}
        unit: ед./час
        note: Расход выбирает игрок — спокойная работа или на износ
        decision: D-091
      - key: body.food_restore
        value: 25
        unit: ед.
        note: За приём обычной еды, мгновенно
        decision: D-091
      - key: body.diet_variety_bonus
        value: 20
        unit: "%"
        note: К восстановлению за разнообразие рациона
      - key: body.hibernation_rate
        value: 8
        unit: ед./час
        note: Восстановление в гибернации, офлайн
        decision: D-091
      - key: body.hibernation_home_k
        value: 1.5
        unit: "×"
        note: Дома гибернация идёт быстрее
        decision: D-091

  # Добыча: соседи по жиле и истощение мира (D-099, D-101)
  - id: mining
    title: Добыча
    constants:
      - key: mining.rich_threshold
        value: 60
        unit: качества жилы
        note: Выше — жила считается богатой, ниже — бедной
        decision: D-099
      - key: mining.crowd_rich_penalty
        value: 15
        unit: "%"
        note: К выходу каждого за каждого лишнего добытчика на богатой жиле
        decision: D-099
      - key: mining.crowd_poor_bonus
        value: 10
        unit: "%"
        note: К выходу каждого за каждого соседа на бедной жиле
        decision: D-099
      - key: mining.crowd_bonus_cap
        value: 6
        unit: человек
        note: Дальше артель бонус не наращивает
        decision: D-099
      - key: vein.depletion_step
        value: 100000
        unit: ед. сырья
        note: Сколько нужно добыть на планете, чтобы сработал шаг истощения
        decision: D-101
      - key: vein.richness_decay
        value: 3
        unit: "%"
        note: На столько беднее становятся новые жилы планеты за каждый шаг
        decision: D-101

      # Механика «Свод» (D-143). Одна на все три сырья в Э1.
      # Скрытое число — устойчивость свода 0…100. Сессия конечна не таймером,
      # а тем, что крепь не поднимает устойчивость выше потолка: чинить свод
      # бесконечно нельзя, и уйти придётся в любом случае — вопрос когда
      - key: mine.roof_start
        value: 100
        unit: устойчивости
        note: Стартовая устойчивость свода. Богатая жила даёт меньше — за богатство платят риском
        decision: D-143
      - key: mine.roof_per_swing
        value: 6
        unit: устойчивости за удар
        note: Без единой крепи свод держит около шестнадцати ударов. Это и есть длина короткой сессии
        decision: D-143
      - key: mine.roof_per_timber
        value: 25
        unit: устойчивости
        note: Одна крепь покупает примерно четыре удара. Выгодна ли она — решает цена бруса против цены руды
        decision: D-143
      - key: mine.roof_timber_cap
        value: 80
        unit: устойчивости
        note: Выше этого крепь не поднимает. Главная ручка механики — она делает сессию конечной
        decision: D-143
      - key: mine.pace_k
        value: 1.5
        unit: "×"
        note: Быстрый темп — во столько раз больше и выхода, и просадки свода, и расхода выносливости (D-091)
        decision: D-143
      # Ключи полос, а не слова: слова живут в локалях движка и приезжают
      # игроку на его языке (D-303). Раньше здесь стояли русские строки, и
      # англоязычный читал их как есть
      - key: mine.sign_bands
        value:
          roof_dry: 70
          roof_dust: 45
          roof_creaks: 20
          roof_cracking: 0
        unit: устойчивости
        note: Нижняя граница полосы. Игрок видит строку, а не число — это делает решение решением
        decision: D-143
      # Своя мера у каждой выработки, и она скрыта (D-302). Без неё свод
      # вычислялся арифметикой: богатство видно числом, стартовый свод —
      # формула от него, а упор крепи в публичный потолок называл число точно
      - key: mine.roof_spread
        value: 8
        unit: устойчивости
        note: "На столько у каждой жилы свой стартовый свод и свой потолок крепи отличаются от расчётных, в обе стороны. Вровень с `mine.sign_noise`: своя мера выработки не уже той лжи, которой признак о ней говорит, и обе больше одного удара — счёт ударов не закрывает разрыв никогда"
        decision: D-302
      # Завал разбирают ударами вхолостую (D-301): обвал больше не дарит
      # соседу целую выработку
      - key: mine.rubble_swings
        value: 6
        unit: ударов
        note: Сколько ударов без выхода стоит разбор завала на жиле обычного богатства (`mining.rich_threshold`); богаче жила — дольше разбор. Против сессии в шестнадцать ударов это заметно, но не смертельно
        decision: D-301
      - key: mine.sign_noise
        value: 8
        unit: устойчивости
        note: На столько признак врёт в обе стороны. Без этого полосы обратимы в арифметику и скрытого числа больше нет
        decision: D-143
      - key: mine.collapse_wear
        value: 15
        unit: "% состояния"
        note: Дополнительный износ инструмента при обрушении — пять сессий разом
        decision: D-143
      # Обвал убивает одинаково новичка и старожила (20-systems/08), но не
      # броском, а счётом на теле (D-294)
      # Правило забоя называет этот счёт словами («первый обвал… но не
      # второй», ui-mine-rule в обоих языках): D-294 требует, чтобы игрок
      # читал предел до входа. Меняешь число — перепиши и эти две строки;
      # предупреждение ui-mine-last-cave-in числа не называет и переживёт
      - key: mine.collapses_survived
        value: 1
        unit: обвал
        note: "Сколько обвалов тело переживает. Следующий убивает, и всё, что тело несло, остаётся лежать в узле"
        decision: D-294
      - key: mine.collapse_wound_chance
        value: 25
        unit: "%"
        note: Шанс раны при обрушении. Лечится по `wound.*`, и в альфе среда — единственный источник ранений (D-111)
        decision: D-143

  # Ранения и медицина (D-096). Источник ранений в альфе — среда, а не люди (D-111)
  - id: conflict
    title: Ранения и медицина
    constants:
      - key: wound.recovery_hours
        value: {min: 6, max: 48}
        unit: часов
        note: Само заживает медленно и всё это время мешает
        decision: D-096
      - key: wound.stamina_penalty
        value: 40
        unit: "%"
        note: К расходу выносливости, пока ранение не залечено
        decision: D-096
      - key: wound.treated_multiplier
        value: 0.3
        unit: "×"
        note: Во столько раз короче выздоровление под лечением
        decision: D-096
      - key: medicine.field_kit_effect
        value: 30
        unit: "%"
        note: Перевязка на месте, без врача и лекарств
        decision: D-096

  # Право и правопорядок (D-094, D-095)
  - id: law_and_order
    title: Право и правопорядок
    constants:
      - key: charter.silence_days
        value: 21
        unit: суток
        note: Молчание правителя, после которого срабатывает пункт устава о преемнике
        decision: D-094
      - key: justice.court_fee
        value: 20
        unit: ТК
        note: Пошлина за возбуждение дела
      - key: justice.claim_window
        value: 14
        unit: суток
        note: Срок подачи иска после нарушения. Вечных претензий не бывает
        decision: D-117
      - key: justice.log_retention
        value: 90
        unit: суток
        note: Срок хранения судебных журналов
      - key: justice.prison_max
        value: 14
        unit: суток
        note: Потолок срока заключения по одному приговору
        decision: D-095
      - key: record.city_retention
        value: 30
        unit: суток
        note: Срок хранения записей городских построек
        decision: D-081
      - key: build.demolish_days_manual
        value: 30
        unit: суток
        note: Снос чужой постройки вручную. Столько, что в одиночку этим не занимаются
        decision: D-095
      - key: build.demolish_days_machine
        value: 2
        unit: суток
        note: Со специальной техникой
        decision: D-095
      - key: build.abandoned_site_days
        value: 14
        unit: суток
        note: Брошенная стройка освобождает участок
        decision: D-090

  # Земледелие: семена, почва и рацион (D-105)
  - id: farm
    title: Земледелие и еда
    constants:
      - key: farm.seed_rate
        value: 4
        unit: семени/м²
        note: Норма высева на метр делянки. Меньше — пустые места, больше — загущение и болезни
        decision: D-105
      - key: farm.seed_mass
        value: 0.01
        unit: кг/семя
        note: Семена мелкие, и разница между культурами для веса несущественна.
          Без этой величины семенной фонд проходил бы мимо предела носимого.
          Идёт в ногу с массами сырья — они снижены впятеро вместе с ней (D-228)
        decision: D-146
      - key: farm.yield_per_m2
        value: 0.6
        unit: ед./м² за цикл
        note: Ориентир для средней культуры. По каждой считается отдельно из `harvest.rates` (D-136)
        decision: D-133
      - key: farm.cycle_days
        value: 6
        unit: суток
        note: Цикл средней культуры. У каждой свой — см. каталог культур (D-136)
        decision: D-133
      - key: plant.trait_budget
        value: 3.5
        unit: балла
        note: Потолок суммы достоинств культуры. Хорошей во всём быть не должно (D-057)
        decision: D-136
      - key: farm.plot_min_area
        value: 5
        unit: м²
        note: Меньше делянку не размечают — обход съедает больше, чем она родит
        decision: D-118
      - key: farm.plot_overhead
        value: 2
        unit: минуты/делянку
        note: Накладные одного действия на делянке — полива, подкормки — независимо
          от её площади (D-296; прежде обход). Это цена дробления
        decision: D-118
      - key: farm.care_time_per_m2
        value: 0.1
        unit: минуты/м²
        note: Действие сверх накладных, минуты за метр. Отсюда потолок того,
          сколько земли тянет один человек
        decision: D-118
      - key: farm.plow_time_per_m2
        value: 0.5
        unit: минуты/м²
        note: Вспашка раз в цикл и после каждой перекройки границ
        decision: D-118
      - key: farm.water_per_m2
        value: 6
        unit: литров/м²
        note: От сухой земли до полной влаги. Полив до цели берёт долю от этого;
          река делает полив редким, а не бесплатным по труду
        decision: D-296
      - key: farm.water_by_need
        value: {"1": 0.5, "2": 1.0, "3": 1.5}
        unit: множитель испарения
        note: Скорость потребления влаги культурой (requires.water), множитель к
          farm.dry_rate. Рыжик пьёт вполовину, лён — в полтора раза (D-296;
          прежде — норма полива)
        decision: D-296
      - key: farm.hardiness_relief
        value: 50
        unit: "%"
        note: Насколько выносливость 5/5 гасит стресс делянки (D-296; прежде —
          штраф небрежности). Кострец прощает вдвое, лён — на пятую часть
        decision: D-261
      - key: farm.shade_built_share
        value: 25
        unit: "% площади"
        note: От этой доли застройки узел теряет ступень света. Лес отнимает
          ступень всегда
        decision: D-261
      - key: farm.disease_spread
        value: 20
        unit: "% делянки в сутки"
        note: Пришедшая напасть расходится внутри делянки, межа её останавливает —
          это цена укрупнения (D-118). Поражение режет урожай и семенную отдачу
          и тянет здоровье (D-299)
        decision: D-118
      - key: farm.seed_return
        value: 3
        unit: крат высеянного
        note: Кратность семенной отдачи при полном уходе на здоровой почве.
          Небрежность и бедная земля опускают её ниже единицы — фонд тает
        decision: D-257
      - key: farm.moisture_by_need
        value: {"1": {min: 20, max: 45}, "2": {min: 40, max: 65}, "3": {min: 60, max: 85}}
        unit: влага 0–100
        note: Полоса влаги по жажде культуры (requires.water). Ниже — жажда,
          выше — перелив; и то и другое стресс
        decision: D-296
      - key: farm.sown_moisture
        value: 50
        unit: влага 0–100
        note: С чем земля выходит из-под сева. Первый полив — решение первых суток
        decision: D-296
      - key: farm.dry_rate
        value: 30
        unit: "% текущей влаги в сутки"
        note: Скорость-доля, не срез суток — за сутки при опорной температуре
          остаётся e^(−0,3) ≈ 74 %. Мокрая земля сохнет быстро, сухая еле-еле.
          Множится на жажду культуры farm.water_by_need, жару, дождь
          (site.rain_water_offset) и реку (farm.river_dry_share)
        decision: D-296
      - key: farm.dry_temp_ref
        value: 15
        unit: °C
        note: Температура, при которой испарение равно farm.dry_rate
        decision: D-296
      - key: farm.dry_per_degree
        value: 3
        unit: "%/°C"
        note: На столько испарение растёт за градус жары сверх farm.dry_temp_ref
          и падает за градус холода
        decision: D-296
      - key: farm.river_dry_share
        value: 50
        unit: "%"
        note: Во столько река замедляет испарение. Река не отменяет полив, а
          делает его редким; вода из неё бесплатна
        decision: D-296
      - key: farm.stress_per_point
        value: 0.5
        unit: здоровья/сутки за пункт
        note: За каждый пункт влаги за краем полосы культуры, в сутки. Засуха и
          перелив — одна формула; выносливость сорта гасит долю farm.hardiness_relief
        decision: D-296
      - key: farm.heal_per_day
        value: 5
        unit: здоровья/сутки
        note: Возврат здоровья за сутки в полосе влаги. Растение прощает,
          но медленнее, чем страдает
        decision: D-296
      - key: farm.stage_bounds
        value: {leaf: 20, bloom: 45, fill: 70}
        unit: рост 0–100
        note: Границы фаз, общие для всех культур; всходы — от нуля, спелость —
          сто. Игрок видит фазу, а не число
        decision: D-296
      - key: farm.health_bands
        value: {strong: 70, weak: 40, sick: 15}
        unit: здоровье 0–100
        note: С какого здоровья делянка «стоит крепко», «слабеет», «болеет»;
          ниже последнего — «гибнет». Игрок видит слово, а не число
        decision: D-296
      - key: farm.feed_wrong_burn
        value: 25
        unit: здоровья
        note: Ожог за удобрение не в свою фазу или не для этой культуры —
          реакция пары задана в plants.yaml
        decision: D-296
      - key: farm.overfeed_yield_penalty
        value: 20
        unit: "% урожая"
        note: За каждое повторное кормление в одной фазе — жирование в ботву
          вместо плода
        decision: D-296
      - key: farm.weed_per_day
        value: 8
        unit: засорённости/сутки
        note: Сорняк растёт от посева, вдвое быстрее на земле вдвое плодороднее
          (× плодородие/100). Богатая почва кормит и его — плата за плодородие
        decision: D-297
      - key: farm.weed_drag
        value: 50
        unit: "% темпа роста"
        note: Столько роста отнимает сплошной сорняк; доля — по засорённости
        decision: D-297
      - key: farm.weed_thirst
        value: 50
        unit: "% испарения"
        note: На столько сплошной сорняк ускоряет уход влаги — он пьёт вместе с культурой
        decision: D-297
      - key: farm.weed_seen
        value: 30
        unit: засорённости
        note: С этого порога сорняк виден как симптом. Норма прополки — в тексте агротехники
        decision: D-297
      - key: farm.crowd_penalty
        value: 50
        unit: "% урожая"
        note: Столько теряет непрореженная делянка при боязни тесноты 5/5;
          доля — по density_risk культуры
        decision: D-297
      - key: farm.thin_loss
        value: 10
        unit: "% урожая"
        note: Цена прореживания — выдернутые всходы не вернуть, ни урожаем, ни семенами.
          Кострецу не окупается, льну необходимо
        decision: D-297
      - key: farm.thin_until
        value: leaf
        unit: фаза
        note: Последняя фаза, в которую прореживание ещё действует; позже — отказ
        decision: D-297
      # Напасти (D-299): четыре ошибки — четыре беды. Давление копится
      # детерминированно, бросков нет; аккуратная делянка не болеет вовсе
      - key: farm.pest_pressure
        value: 75
        unit: давления/сутки
        note: Столько копит полная ошибка у культуры с боязнью 5/5 — порог она
          берёт за полтора суток, средняя боязнь за трое-четверо, то есть внутри
          цикла, а не после него. Доля ошибки — насколько влага вышла за полосу,
          насколько сорняк перерос порог farm.weed_seen, есть ли промах
          подкормки; множитель — disease_risk/5
        decision: D-299
      - key: farm.pest_relief
        value: 10
        unit: давления/сутки
        note: На столько спадает счётчик, когда своей ошибки нет. Исправленная
          ошибка прощается не сразу
        decision: D-299
      - key: farm.crowd_pest
        value: 50
        unit: "% давления"
        note: Настолько быстрее копит непрореженная делянка — в тесноте не
          продувает. Общая надбавка всем четырём напастям
        decision: D-299
      - key: farm.pest_onset
        value: 10
        unit: поражения
        note: С этой доли начинается напасть, когда давление перевалило сотню.
          Счётчик при этом разряжается в ноль
        decision: D-299
      - key: farm.pest_stress
        value: 5
        unit: здоровья/сутки
        note: Столько отнимает полное поражение. Пока напасть стоит, делянка не
          залечивается вовсе (farm.heal_per_day не идёт), поэтому запущенная
          убивает — медленнее засухи, но убивает
        decision: D-299
      - key: farm.pest_seen
        value: 15
        unit: поражения
        note: С этого порога знак напасти виден. Знак говорит, что видно глазом;
          чем гасят — в тексте агротехники (D-057)
        decision: D-299
      - key: farm.protectant_per_m2
        value: 0.3
        unit: ед./м²
        note: Норма обработки. Одна на все средства — разница видов в длине
          защиты, а не в дозе
        decision: D-299
      # Длина защиты — строка по вещи, поведение «обрабатывает делянку» — у
      # класса (D-215, D-291). Сборка сверяет: у каждого члена четырёх классов
      # есть строка, и у каждой строки — член класса
      - key: farm.protect_days
        value: {Серная присыпка: 4, Масляная эмульсия: 3, Травяной настой: 6, Медный раствор: 9}
        unit: суток
        note: Пока держится, счётчик своей напасти не растёт, а пришедшая замирает.
          Дешёвое средство держит короче цикла самой быстрой культуры, дорогое —
          дольше цикла самой долгой
        decision: D-299
      - key: farm.pest_cure
        value: {fungus: fungicide, mite: acaricide, insect: insecticide, bacteria: bactericide}
        unit: класс
        note: Какая напасть каким классом гасится. Обработка не своим классом —
          потраченная доза; связка живёт в данных, а не в коде
        decision: D-299
      - key: farm.soil_depletion
        value: 8
        unit: "% плодородия"
        note: За каждый цикл на делянке, культура любая. Повтор той же добавляет
          farm.monoculture_penalty (D-105)
        decision: D-256
      - key: farm.monoculture_penalty
        value: 8
        unit: "% плодородия"
        note: Сверх farm.soil_depletion за повтор той же культуры подряд.
          Монокультура ест землю вдвое
        decision: D-256
      - key: farm.soil_share_cap
        value: 120
        unit: "% нормы"
        note: Потолок отдачи от избытка плодородия. Хорошая земля — преимущество,
          а не множитель
        decision: D-256
      # Сила удобрения — таблица по вещи, а само поведение «вносится в
      # землю» — у класса «Удобрение» (D-291): третье удобрение — строка
      # здесь и класс у рецепта, без правки кода. Сборка сверяет: у каждого
      # члена класса есть строка, и у каждой строки — член класса
      - key: farm.fertilizer_recovery
        value: {Компост: 10, Минеральное удобрение: 25}
        unit: "% плодородия"
        note: За внесение в пар или вспаханное. Минеральное — больше всех;
          селитра из Соляных пустошей делит его с консервацией,
          аккумуляторами и ракетой. Бобы возвращают своё per-культурным
          restores из plants.yaml (D-264)
        decision: D-291
      - key: farm.fertilizer_per_m2
        value: 0.5
        unit: ед./м²
        note: Норма внесения любого удобрения. Разница видов — в силе,
          а не в дозе
        decision: D-264
      - key: farm.fallow_recovery
        value: 2
        unit: "% в сутки"
        note: Делянка под паром. Медленно, зато бесплатно
        decision: D-105
      - key: food.variety_window
        value: 6
        unit: приёмов пищи
        note: Сколько последних учитывается при подсчёте разнообразия
        decision: D-105
      - key: food.variety_min_kinds
        value: 3
        unit: вида
        note: Столько разных блюд в окне — и работает `body.diet_variety_bonus`
        decision: D-105

  # Готовка: единственный передел, который идёт вниз по прочности (D-119)
  - id: cooking
    title: Готовка
    constants:
      - key: cook.dish_roles
        value: 4
        unit: роли
        note: Основа, наполнитель, жир, приправа. Что положить в роль — решает повар
        decision: D-119
      - key: cook.pot_portions
        value: 8
        unit: порций
        note: Выход одного котла. Готовят потоком, а не поштучно
        decision: D-119
      - key: cook.spoilage_multiplier
        value: 4
        unit: "×"
        note: Готовое портится вчетверо быстрее сырья. Отсюда повар живёт при едоке
        decision: D-119
      - key: cook.hot_restore_share
        value: 60
        unit: "% от `body.food_restore`"
        note: Горячее восполняет меньше сразу — остальное отдаёт временем
        decision: D-119
      - key: cook.hot_drain_reduction
        value: 20
        unit: "%"
        note: На столько горячее блюдо снижает `body.drain_rate`
        decision: D-119
      - key: cook.hot_duration
        value: 3
        unit: часа
        note: Столько держится сытость от горячего
        decision: D-119
      - key: cook.role_weights
        value: {основа: 0.5, наполнитель: 0.2, жир: 0.2, приправа: 0.1}
        unit: "×"
        note: Вес роли в качестве блюда. Отличная репа важнее отличной соли
        decision: D-128
      - key: cook.empty_role_penalty
        value: 25
        unit: "% за роль"
        note: Столько снимается за каждую незакрытую роль. Дешёвый жир лучше, чем никакого
        decision: D-128
      - key: cook.hot_quality_min
        value: 50
        unit: качества
        note: Ниже этого горячее просто еда. Выше `agro.quality_cap` — значит машинная не даёт сытости никогда
        decision: D-121
      - key: food.restore_by_quality
        value: {min: 0.7, max: 1.3}
        unit: "×"
        note: Множитель к `body.food_restore` от качества 0 до 100. Дешёвая еда кормит хуже, но кормит
        decision: D-121
      - key: law.ration_window
        value: 24
        unit: часа
        note: Окно, за которое считается норма отпуска регулируемого товара
        decision: D-122

  # Внешняя торговля города и приборы, по которым её правят (D-123, D-124)
  - id: trade
    title: Пошлины и торговая сводка
    constants:
      - key: trade.duty_free_window
        value: 24
        unit: часа
        note: Окно, за которое считается беспошлинная норма ввоза и вывоза на человека
        decision: D-123
      - key: trade.reference_price_window
        value: 48
        unit: часов
        note: По сделкам за этот срок берётся справочная цена товара. Сделок не было — пошлину не с чего считать
        decision: D-123
      - key: trade.report_window
        value: 24
        unit: часа
        note: Шаг торговой сводки города. Не биржевой терминал, а инструмент управления
        decision: D-124
      - key: trade.report_retention
        value: 30
        unit: суток
        note: Глубина истории сводки. Столько власть видит назад, чтобы отличить всплеск от тенденции
        decision: D-124

  # Здание универсально: его считает формула, а не рецепт (D-106)
  - id: building
    title: Здание
    constants:
      - key: build.area_min
        value: 10
        unit: м²
        note: Пятно меньше этого не строится — это уже навес, а не здание. Потолок площади задаёт участок, а не число (D-218)
        decision: D-218
      - key: build.slots_per_area
        value: 10
        unit: м² на станцию
        note: Сколько площади занимает одно рабочее место или стеллаж
        decision: D-106
      # Плотность склада: сваленное на пол занимает метры (D-192). Число такое,
      # чтобы сундук окупал своё место: 300 кг в нём — это 15 м² кучи против
      # 10 м² под сам сундук
      - key: build.floor_per_m2
        value: 20
        unit: кг на м²
        note: Сколько груза помещается на квадратный метр пола. Уложенное в сундук площади не занимает
        decision: D-192
      # Стройка — время и выносливость (D-266): материалы приносят вкладами на
      # площадку, а «Начать строительство» платит телом за каждый метр жилой
      # площади. Дом в 200 м² на трёх этажах — 60 выносливости: решение, а не клик
      - key: build.start_stamina_per_m2
        value: 0.1
        unit: ед. на м² жилой площади
        note: Сколько выносливости берёт запуск стройки за каждый квадратный метр жилой площади (пятно × этажи)
        decision: D-266
      - key: build.cost_per_area
        formula: "types[kind] * footprint * sum(build.floor_growth_by_type[kind]^(n-1) for n in 1..floors)"
        note: Смета здания. Считается от типа, пятна застройки и этажности, а не берётся из рецепта (D-218)
        decision: D-218
      # Тип здания решает три вещи разом (D-218): из чего построено, во сколько
      # раз дорожает следующий этаж и как быстро дом ветшает. Потолка высоты
      # нет ни у одного типа — башню сдерживает цена этажа, а не запрет
      - key: build.types
        value:
          деревянный:
            Дерево: 10
          каменный:
            Дерево: 5
            Камень: 10
          бетонный:
            Камень: 15
            Раствор: 5
          железобетонный:
            Слиток железа: 5
            Камень: 15
            Раствор: 5
            Стекло: 1
          цельнометаллический:
            Слиток железа: 25
            Стекло: 5
        unit: ед./м²
        note: Материалы на квадратный метр пола первого этажа. Это тот самый состав из сметы `build.cost_per_area`
        decision: D-218
      - key: build.floor_growth_by_type
        value:
          деревянный: 2
          каменный: 1.5
          бетонный: 1.25
          железобетонный: 1.13
          цельнометаллический: 1.06
        unit: "×"
        note: Во столько раз каждый следующий этаж дороже предыдущего. Укрепление сидит здесь, отдельной строкой сметы его больше нет
        decision: D-218
      - key: build.decay_by_type
        value:
          деревянный: 0.5
          каменный: 0.3
          бетонный: 0.2
          железобетонный: 0.1
          цельнометаллический: 0.05
        unit: "% в сутки"
        note: Скорость порчи. Сруб чинят дважды в год, цельнометаллический дом — раз в поколение
        decision: D-218
      - key: build.repair_materials_k
        value: 0.4
        unit: доля сметы
        note: Столько материалов сметы уходит на подъём состояния с нуля до полного. Чем построено, тем и чинится (D-145)
        decision: D-218
      - key: build.repair_labor_k
        value: 0.35
        unit: доля труда
        note: Столько труда постройки уходит на полный ремонт. Стены стоят, потому и дешевле сборки
        decision: D-218
      - key: build.labor_per_m2
        value: 0.4
        unit: человеко-часа/м²
        note: Труд сборки, с поправкой на этажность и прочность. Мини-игры у стройки нет
        decision: D-131
      - key: build.labor_stamina_rate
        value: 12
        unit: выносливости/час
        note: Расход на площадке. Стройка — работа, а не кнопка
        decision: D-131
      # Снос (D-205). Разбор быстрее сборки, но материал ломается: доля назад
      # такая, чтобы «снести и построить заново» стоило дороже, чем построить
      # сразу верно, и всё же оставалось выходом из ошибки
      - key: build.demolish_labor_k
        value: 0.5
        unit: "×"
        note: Доля от трудозатрат постройки, которую занимает снос
        decision: D-205
      # Лестница: этаж выше первого — отдельный узел, и на него поднимаются
      # (D-247). Пролёт короткий, но не бесплатный: мастерская на восьмом
      # этаже должна быть решением, а не бесплатной надстройкой к первому
      - key: build.stair_seconds
        value: 20
        unit: секунд
        note: Подъём на один этаж. Дом — помещение, по которому ходят, а не земля, которую пересекают
        decision: D-247

      - key: build.demolish_salvage
        value: 0.3
        unit: доля
        note: Сколько материалов сметы возвращается при сносе. Остальное ломается при разборе
        decision: D-205

  # Дороги: ребро графа, а не постройка на узле (D-107)
  - id: road
    title: Дороги
    constants:
      # Чем ребро укладывали, тем оно и садится (D-252): множитель к
      # road.decay_rate по виду полотна. Ребро помнит доминирующий вид
      # последней укладки; ярус упал — память стёрлась вместе с покрытием
      - key: road.decay_by_paving
        value:
          Дорожное полотно: 1
          Асфальтовое полотно: 0.5
        unit: × к road.decay_rate
        note: Асфальт садится вдвое медленнее гравия — в этом весь его смысл. Полотна нет в таблице — множитель единица
        decision: D-252
      - key: road.trail_multiplier
        value: 2.5
        unit: "×"
        note: Во столько раз дольше идти там, где дороги нет вовсе
        decision: D-107
      - key: road.road_multiplier
        value: 1
        unit: "×"
        note: Обычная дорога — эталон времени в пути
        decision: D-107
      - key: road.paved_multiplier
        value: 0.7
        unit: "×"
        note: Мощёный тракт — быстрее и держит тяжёлый транспорт
        decision: D-107
      - key: road.surface_per_edge
        value: 40
        unit: ед. полотна
        note: Сколько дорожного полотна укладывается в одно ребро
        decision: D-107
      - key: road.build_hours
        value: 8
        unit: ч
        note: "Укладка одной ступени покрытия на ребро: тропа → дорога → тракт. Проект, а не кнопка"
        decision: D-158
      - key: road.decay_rate
        value: 1
        unit: "% в сутки"
        note: Без содержания дорога зарастает и возвращается в тропу
        decision: D-107
      - key: road.toll_max
        value: 20
        unit: ТК
        note: Потолок пошлины за проезд по частной дороге
        decision: D-107

  # Вычислительная плата за сессию добычи (D-110): фиксированная, не по мощности
  - id: pow
    title: Плата устройства
    constants:
      - key: pow.session_compute
        value: 1
        unit: задача/сессию
        note: Одна вычислительная задача на одну сессию добычи. Одинаковая для всех
        decision: D-110
      - key: pow.compute_time_target
        value: 2
        unit: секунды
        note: Столько она занимает на среднем устройстве. Потолок, а не цель роста
        decision: D-110
      - key: pow.compute_time_cap
        value: 6
        unit: секунд
        note: Дольше — наказываем телефон. Сложность подстраивается под этот предел
        decision: D-110
      - key: pow.memory_per_session
        value: 64
        unit: МБ
        note: Память на одну оценку. Именно она делает параллельный сеанс дорогим
        decision: D-112
      - key: pow.argon_iterations
        value: 3
        unit: прохода
        note: Число проходов Argon2id. Подбирается так, чтобы средний телефон уложился в цель
        decision: D-113
      - key: pow.verify_cost
        value: 1
        unit: оценка
        note: Столько считает сервер при проверке. Дороже — и античит станет узким местом
        decision: D-112

  # Буровая установка: капитал вместо труда (D-115)
  - id: rig
    title: Буровая установка
    constants:
      - key: rig.output_per_hour
        value: 25
        unit: ед./час
        note: Против 60 у живого шахтёра. Машина берёт не темпом, а тем, что не спит
        decision: D-115
      - key: rig.quality_cap
        value: 45
        unit: качества
        note: Потолок качества руды из буровой. Человек подстраивается под пласт, машина нет
        decision: D-115
      - key: rig.fuel_per_hour
        value: 3
        unit: угля/час
        note: Встала без топлива — не добывает вовсе
        decision: D-115
      - key: rig.hopper_capacity
        value: 12
        unit: часов работы
        note: Бункер полон — установка останавливается. Приезжать и опустошать обязательно
        decision: D-115
      - key: rig.wear_per_day
        value: 6
        unit: "% состояния"
        note: Обслуживание тратит ремонтный набор
        decision: D-115
      - key: rig.depletion_multiplier
        value: 2
        unit: "×"
        note: Во столько раз быстрее буровая выедает жилу (D-101)
        decision: D-115

  # Автоматы (D-253): станции, работающие без игрока. Одни ручки на всё
  # семейство; сборка и охват станций — в auto.covers
  - id: auto
    title: Автоматизация
    constants:
      - key: auto.energy_per_hour
        value: 6
        unit: энергии/час
        note: Встал без питания — не работает. Тариф города решает рентабельность фабрики, как у полевого автомата
        decision: D-253
      - key: auto.lube_per_hour
        value: 0.5
        unit: смазки/час
        note: Кровь автоматов — берётся из тар здания. Кончилась — фабрика стоит; подвоз смазки — уголь буровых
        decision: D-253
      - key: auto.wear_per_day
        value: 5
        unit: "% состояния"
        note: Обслуживание тратит ремонтный набор. Заброшенный разваливается, как буровая и полевой
        decision: D-253
      - key: auto.quality_cap
        value: 45
        unit: качества
        note: Потолок качества изделий. Хорошее — руками, много среднего — машиной, как у буровой и агро
        decision: D-253
      - key: auto.speed_share
        value: 70
        unit: "% ручного темпа"
        note: Машина медленнее мастера за станком. Берёт не темпом, а тем, что не спит
        decision: D-253
      # Охват (D-253): какая станция каким автоматом закрывается. Обе стороны
      # — ключи словаря, чтобы переезд имён на id прошёл их насквозь; единица
      # значит членство, не число. Станции вне таблицы — вне автоматизации:
      # очаг, чеканка, библиотека, верфи, «Руками»
      - key: auto.covers
        value:
          Верстак: {Автоматическая станция: 1}
          Кузница: {Автоматическая станция: 1}
          Мельница: {Автоматическая станция: 1}
          Мастерская: {Автоматическая станция: 1}
          Прокатный стан: {Автоматическая станция: 1}
          Токарный станок: {Автоматическая станция: 1}
          Чистая мастерская: {Автоматическая станция: 1}
          Космическая мастерская: {Автоматическая станция: 1}
          Плавильная печь: {Автоматическая печь: 1}
          Высокая печь: {Автоматическая печь: 1}
          Бродильный чан: {Автоматический реактор: 1}
          Электролизёр: {Автоматический реактор: 1}
          Перегонная колонна: {Автоматический реактор: 1}
          Химический реактор: {Автоматический реактор: 1}
        unit: членство
        note: Рецепт знает свою станцию, станция — свой автомат. Новый автомат или станция — строка здесь, не код
        decision: D-253
      # Пироксисовый тир закрыт до своей станции (OQ-106): рецепт с таким
      # входом не программируется ни в один автомат
      - key: auto.barred_inputs
        value:
          Пироксит: 1
          Пироксисовая плита: 1
        unit: членство
        note: Рецепты с пирокситом обрабатывает станция пироксисового тира, которой ещё нет (OQ-106)
        decision: D-253

  # Полевой автомат: капитал вместо присутствия в поле (D-120)
  - id: agro
    title: Полевой автомат
    constants:
      - key: agro.yield_share
        value: 70
        unit: "% ручного урожая"
        note: Столько снимает автомат с той же земли. Берёт не выходом, а тем, что не спит
        decision: D-120
      - key: agro.quality_cap
        value: 45
        unit: качества
        note: Потолок качества продуктов. Хорошее блюдо по-прежнему требует ручных (D-119)
        decision: D-120
      - key: agro.plot_min_area
        value: 40
        unit: м²
        note: Меньшую делянку автомат не берёт. Отсюда укрупнение и монокультура
        decision: D-120
      - key: agro.plots_max
        value: 8
        unit: делянок
        note: Столько обслуживает одна машина. Ставка на объём — дешёвая еда должна лежать в стакане всегда
        decision: D-121
      - key: agro.program_steps
        value: 12
        unit: шагов
        note: Потолок длины программы. Цикл безусловный, условий в нём нет
        decision: D-120
      - key: agro.energy_per_hour
        value: 6
        unit: энергии/час
        note: Встал без питания — не растит. Тариф города решает рентабельность фермы
        decision: D-120
      - key: agro.wear_per_day
        value: 5
        unit: "% состояния"
        note: Обслуживание тратит ремонтный набор. Заброшенный разваливается
        decision: D-120

  # Трудоёмкость сырья: сколько единиц даёт час труда (D-133).
  # Из этих темпов выводятся количества входов во всех рецептах — руками
  # они не задаются. Числа якорятся на mining.iron_per_hour = 60.
  - id: harvest
    title: Трудоёмкость сырья
    constants:
      # Числа лежат в реестре материалов (`data/recipes.yaml`, meta.materials,
      # поле `rate`) — по одной строке на вещь (D-215). Здесь остаются ключ,
      # единица и смысл; сборка наполняет значение сама
      - key: harvest.rates
        value_from: materials
        unit: ед./час
        note: Выход часа труда по каждому сырью. Задаёт относительную цену всего в мире. Собирается из реестра материалов
        decision: D-133

      # Жилы планеты (D-232): множители к тем же темпам добычи, а не вторая
      # таблица редкости. Аврора щедра на уголь и бедна железом — этим и
      # держится её экономика: топливо под ногами, металл привозной
      - key: harvest.planet_weights
        value:
          aurora:
            Уголь: 3
            Железная руда: 0.3
            Нефть: 0.6
          pyroxis:
            Пироксит: 8
            Вольфрам: 6
            Никель: 4
            Серебряная порода: 3
            Золотоносная порода: 3
            Железная руда: 0.3
            Уголь: 0.2
            Камень: 0.5
            # Планета из лавы (D-233): органики не было, нефти не из чего
            # быть. Ноль исключает вид из колоды разведки вовсе (D-252)
            Нефть: 0
        note: "Во сколько раз чаще встречается порода на планете. Планеты нет в таблице — веса те же, что на Терре. Пироксис — наоборот Терре: редкое здесь в изобилии, обычное бедно (D-233)"
        decision: D-232

  # Крафт: время партии и потери. Сток С9 наконец получил число (D-129)
  - id: craft
    title: Крафт
    constants:
      - key: craft.input_labor_ratio
        value: 1.0
        unit: "×"
        note: Сколько чужого труда съедает час своего. Из этого выводятся количества входов
        decision: D-133
      - key: craft.amount_cap
        value: 10
        unit: единиц
        note: Потолок количества одного входа. Иначе дешёвое сырьё идёт вёдрами
        decision: D-133
      # Знание бесплатно деньгами, но переписать его — работа (D-148)
      - key: craft.copy_stamina
        value: 1
        unit: ед.
        note: Расход на копирование одного рецепта в Библиотеке. Платит тело, а не счёт
        decision: D-148
      - key: craft.time_growth_per_level
        value: 2.0
        unit: "×"
        note: Во столько раз дольше делается изделие с каждым переделом вглубь. Главная ручка ценности лестницы
        decision: D-133
      - key: craft.time_per_unit
        value: 6
        unit: минут/единицу
        note: Базовое время партии на единицу выхода. Считается от него, а не задаётся рецептом
        decision: D-129
      - key: craft.station_speed_k
        value: {min: 0.6, max: 1.4}
        unit: "×"
        note: Множитель времени от качества станции. Разбитая наковальня работает медленно
        decision: D-129
      - key: craft.batch_max
        value: 50
        unit: единиц
        note: Потолок одной партии. Чтобы очередь не превращалась в сутки безнадзорной работы
        decision: D-129
      # Станок на электричестве (D-269): час ручной партии у него стоит
      # столько же, сколько час автомата — две ручки, один смысл машинного часа
      - key: craft.powered_energy_per_hour
        value: 6
        unit: энергии/час
        note: Расход станка на электричестве за час ручной партии. Из пула по тарифу, вне города — из аккумуляторов рядом; без питания станок стоит
        decision: D-269
      - key: craft.waste_share
        value: 5
        unit: "% входов"
        note: Брак и угар при верной работе. Это и есть сток С9
        decision: D-129
      - key: craft.waste_bad_ratio
        value: 15
        unit: "% входов"
        note: Потери при промахе по пропорции у смеси. Плохая плавка съедает больше
        decision: D-129
      - key: craft.recycle_return
        value: 40
        unit: "% вложенного"
        note: Сколько материалов возвращает переработка. Разница — сток
        decision: D-129
      - key: craft.repair_cost_share
        value: 25
        unit: "% новой вещи"
        note: Во что обходится ремонт. Потолок при этом падает на `quality.repair_ceiling_loss`
        decision: D-129

  # Транспорт: без этих чисел инвариант И4 нечем проверить (D-129)
  - id: transport
    title: Транспорт
    constants:
      - key: inventory.carry_volume
        value: 40
        unit: литров
        note: Объём носимого. Руда упирается в массу, ткань — в объём
        decision: D-129
      - key: transport.mass_cart
        value: 80
        unit: кг
        note: Тачка и вьючное животное. Дешёвый вход в торговлю
        decision: D-129
      - key: transport.mass_wagon
        value: 400
        unit: кг
        note: Повозка. Требует дороги (D-107)
        decision: D-129
      - key: transport.mass_boat
        value: 2000
        unit: кг
        note: Речное и морское судно. Дёшево на тонно-час, но только по воде
        decision: D-129
      - key: transport.mass_airship
        value: 600
        unit: кг
        note: Дирижабль. Игнорирует рельеф, дорог в топливе
        decision: D-129
      - key: transport.mass_ship
        value: 5000
        unit: кг
        note: Космический корабль. Единственная связь между планетами
        decision: D-129
      - key: transport.volume_per_mass
        value: 3
        unit: литра/кг
        note: Сколько объёма приходится на килограмм грузоподъёмности у всех типов
        decision: D-129
      - key: transport.speed_k
        value: {тачка: 0.9, повозка: 1.3, судно: 1.6, дирижабль: 2.5, корабль: 4}
        unit: "×"
        note: Множитель к скорости пешего перехода
        decision: D-129
      # Та же раскладка, что у скорости, и по тем же ключам (D-157): две
      # раскладки одного и того же разошлись бы. Значения — из `transport.mass_*`
      - key: transport.capacity
        value: {тачка: 80, повозка: 400, судно: 2000, дирижабль: 600, корабль: 5000}
        unit: кг
        note: Грузоподъёмность трюма. Груз едет в транспорте, а не в руках
        decision: D-157
      - key: transport.heavy_from
        value: 1000
        unit: кг грузоподъёмности
        note: "От этой грузоподъёмности транспорт тяжёлый: по дороге не идёт, только по мощёному тракту (D-107)"
        decision: D-157
      - key: transport.upkeep_per_leg
        value: 2
        unit: ТК/отрезок
        note: Корм, топливо или заряд за один переход между узлами
        decision: D-129
      - key: transport.crew_ship
        value: 2
        unit: человека
        note: Экипаж корабля. Меньше — рейс не стартует
        decision: D-129
      - key: transport.stamina_k
        value: 0
        unit: "×"
        note: Множитель расхода выносливости в пути с транспортом. Ноль — везёт транспорт, а не ноги
        decision: D-147

  # Корабль перестал быть строкой в `transport.*` (D-201): он не впрягается, не
  # едет по рёбрам планеты и не имеет заданной грузоподъёмности. Всё, что о нём
  # можно сказать числом, складывается из построенного — отсюда своя группа.
  # `transport.mass_ship`, `transport.crew_ship` и корабль в раскладках
  # `transport.speed_k` / `capacity` описывают отменённую модель «корабль —
  # предмет» и держатся только ради старых миров
  # Тяжесть планет (D-245): множителем к Терре. Решает, сколько стоит
  # оторваться от планеты и сколько — сесть на неё, и потому это первое число,
  # которым планеты отличаются друг от друга ещё до всякой геологии
  - id: planet
    title: Планеты
    constants:
      - key: planet.gravity
        value: {terra: 1.0, pyroxis: 1.3, aurora: 0.8, aquatica: 1.1}
        unit: доля земной
        note: >-
          Пироксис плотный и тяжёлый — взлёт с него дороже всего, и это
          отдельная причина, почему вахта туда идёт на пределе. Аврора лёгкая:
          с ледяной планеты уходят дёшево, а вот сесть на неё мешает не тяжесть,
          а тёмные маяки (D-232)
        decision: D-245
      - key: planet.radius
        value: {terra: 0.5, pyroxis: 0.35, aurora: 0.45, aquatica: 0.6}
        unit: ед. карты
        note: Радиус тела для симуляции (D-289) — ближе корабль разбивается. Меньше стоянки `orbit.park_radius`; читается с волны 2
        decision: D-289

  - id: ship
    title: Космический корабль
    constants:
      - key: ship.node_mass
        value: 2000
        unit: кг
        note: Масса одного пустого узла борта. Каждый добавленный узел — и полезное место, и лишняя масса
        decision: D-202
      - key: ship.node_area
        value: 40
        unit: м²
        note: Площадь узла борта. Сколько в него встанет оборудования, считает та же формула мест, что у здания
        decision: D-202
      - key: ship.foundation_hours
        value: 8
        unit: часов
        note: Закладка одного узла борта. Длительное действие, идёт офлайн
        decision: D-202
      # Раскладка по НАЗВАНИЮ двигателя, как `transport.capacity` по названию
      # транспорта: движок не держит списка «какие бывают двигатели». Двигателей
      # II и III классов на лестнице ещё нет — числа заведены заранее, чтобы
      # рецепт заработал без правки кода
      - key: ship.thrust
        value: {Двигатель I класса: 3000, Двигатель II класса: 12000, Двигатель III класса: 40000}
        unit: кг тяги
        note: Тяга двигателя. Сумма по установленным делится на массу и даёт тяговооружённость
        decision: D-202
      - key: ship.engine_class
        value: {Двигатель I класса: 1, Двигатель II класса: 2, Двигатель III класса: 3}
        unit: класс
        note: Класс двигателя. Класс корабля — по самому слабому из установленных (D-037, D-054)
        decision: D-202
      # Подъём и спуск (D-245): ступень между космодромом и околопланетной
      # орбитой. Раньше её не было вовсе — отстыковка была мгновенной и
      # бесплатной, а спуск стоил целого перехода, и вернуться на ту же
      # планету стоило дороже, чем с неё уйти
      - key: ship.ascent_hours
        value: 4
        unit: часов
        note: >-
          Подъём с космодрома на орбиту своей планеты при эталонной
          тяговооружённости и земной тяжести. Умножается на `planet.gravity`
          и растягивается тяговооружённостью, как любой переход
        decision: D-245
      - key: ship.descent_hours
        value: 3
        unit: часов
        note: >-
          Спуск с орбиты на космодром. Короче подъёма: вниз помогает та самая
          тяжесть, против которой поднимались
        decision: D-245
      - key: ship.min_thrust_ratio
        value: 0.15
        unit: тяги на кг массы
        note: Ниже этого корабль не отстыковывается вовсе. Не «летит медленно», а не отрывается
        decision: D-202
      - key: ship.reference_ratio
        value: 0.5
        unit: тяги на кг массы
        note: >-
          Тяговооружённость, при которой подъём и спуск идут ровно по табличному
          времени. Переход между планетами таблицы не имеет: его быстрый край
          задаёт тяга через `orbit.thrust_scale` (D-271)
        decision: D-202
      - key: ship.route_min_share
        value: 50
        unit: "% табличного времени"
        note: Быстрее этого подъём и спуск не идут. Потолок скорости, иначе хватит навесить двигателей на один узел
        decision: D-202
      - key: ship.step_seconds
        value: 1
        unit: секунд
        note: >-
          Шаг между двумя узлами борта. Один и тот же для любой пары: корабль
          не место на карте, а помещение, и ходьба по нему не измеряется
          расстоянием между отсеками
        decision: D-240
      - key: ship.berth_seconds
        value: 1
        unit: секунд за место
        note: >-
          Ходьба по трапу за номер занятого причала: первое место в секунде от
          верфи, второе в двух. Корабль занимает младшее свободное место и
          освобождает его отстыковкой
        decision: D-201
      # Класс двигателя — мощность и КПД, а не пропуск на маршрут (D-235):
      # долететь можно и на первом классе, просто дольше и дороже
      - key: ship.engine_efficiency
        value: {Двигатель I класса: 1, Двигатель II класса: 0.7, Двигатель III класса: 0.5}
        unit: доля расхода
        note: Множитель к расходу топлива по классу корабля (по слабейшему двигателю). Третий класс жжёт вдвое меньше первого
        decision: D-235
      - key: ship.fuel_per_ton_day
        value: 6
        unit: ед. топлива
        note: >-
          Ракетного топлива на тонну массы за сутки подъёма или спуска. Лишний
          узел стоит денег на каждой ноге. Переход между планетами платит не
          часами, а Δv — `ship.fuel_per_ton_speed` (D-271)
        decision: D-202
      - key: ship.fuel_per_ton_speed
        value: 0.03
        unit: ед. топлива
        note: >-
          Ракетного топлива на тонну массы за единицу Δv перехода (единица карты
          в сутки). Быстрая дуга в худший день стоит в десять — пятнадцать раз
          дороже дешёвой в окно: волновая торговля выведена, а не назначена
        decision: D-271
      # Расход считается в эталонных единицах (ракетное топливо = 1), а из
      # бака списывается по плотности вида: единица керосинового закрывает
      # 1.25 эталонной. Вид топлива — экономика рейса, не пропуск на маршрут
      - key: ship.fuel_energy
        value:
          Ракетное топливо: 1
          Керосиновое топливо: 1.25
        unit: эталонных единиц с единицы
        note: Во сколько эталонных единиц обходится единица топлива этого вида. Топлива нет в таблице — единица
        decision: D-252
      # Числа экипажа нет (D-288): расход воздуха и есть предел, как масса —
      # предел груза (D-202). `ship.life_support_crew` снят вместе с кодом

  - id: orbit
    title: Небесная механика
    constants:
      # Перелёт считается по орбитам (D-271): дуга Ламберта вокруг звезды,
      # Δv на двух концах, окно старта из самой геометрии. Тяготение звезды
      # выводится из орбиты планеты — числом оно не задаётся, чтобы два
      # источника не разошлись. Единица длины — единица карты (радиус орбиты
      # в сиде), единица времени — реальные сутки
      - key: orbit.thrust_scale
        value: 1600
        unit: ед. карты / сутки² на единицу тяговооружённости
        note: >-
          Ускорение корабля от тяги к массе. Задаёт быстрый край ползунка:
          двигатели обязаны выдать Δv дуги за `orbit.burn_share` полёта.
          Эталонный корабль (0.5) в сближение идёт Терра — Пироксис за ~10 ч
        decision: D-271
      - key: orbit.burn_share
        value: 0.5
        unit: доля полёта
        note: Какую долю времени полёта двигатели могут работать. Остальное — дуга по инерции
        decision: D-271
      - key: orbit.corona_radius
        value: 35
        unit: ед. карты
        note: >-
          Ниже этого перигелий дуги не опускается: сквозь звезду не срезают.
          Пироксис ходит на 73
        decision: D-271
      - key: orbit.longest_days
        value: 45
        unit: суток
        note: >-
          Горизонт дешёвого края ползунка: дольше этого дуга не предлагается,
          сколько бы ни экономила
        decision: D-271
      # Космос как симуляция (D-289): пять тел, интегратор, стоянка кругом,
      # автопилот, дрейф и гибель. Числа стартовые и проверяются симуляцией;
      # движок читает их с волны 2, и `orbit.flyby_*` ушли с ней (2026-09-03)
      - key: orbit.planet_mu
        value: 150
        unit: ед. карты³/сутки² на долю земной тяжести
        note: Тяготение планеты — умножается на `planet.gravity`. Наследует `orbit.flyby_mu`, но тянет корабль всю дорогу, а не только при пролёте
        decision: D-289
      - key: orbit.park_radius
        value: 1.5
        unit: ед. карты
        note: Радиус стоянки на орбите планеты — аналитический круг, узел орбиты. Оборот на нём около суток
        decision: D-289
      - key: orbit.step_minutes
        value: 1
        unit: минут
        note: Шаг интегратора в тике. Равен `time.tick`; крупнее нельзя — на стоянке оборот 1350 шагов
        decision: D-289
      - key: orbit.plan_step_minutes
        value: 60
        unit: минут
        note: Шаг интегратора при планировании и прогнозе инерции — грубее тика, считается пакетом на все деления ползунка
        decision: D-289
      - key: orbit.capture_radius
        value: 3
        unit: ед. карты
        note: Ближе этого к планете автопилот ставит корабль на круг, если относительная скорость в допуске
        decision: D-289
      - key: orbit.capture_speed
        value: 2
        unit: ед. карты/сутки
        note: Допуск по относительной скорости при постановке на круг — стоянки у планеты и круга вокруг звезды (2026-09-04); круговая на стоянке — около 10
        decision: D-289
      - key: orbit.system_radius
        value: 800
        unit: ед. карты
        note: Дальше корабль недоступен — вдвое дальше Авроры. Уход за черту — гибель по заданию
        decision: D-289
      - key: orbit.forecast_days
        value: 90
        unit: суток
        note: Горизонт прогноза инерции — столкновение или уход из системы ищутся в нём
        decision: D-289
      - key: orbit.restamp_hours
        value: 6
        unit: часов
        note: Как часто тик переставляет отметку косты, чтобы чтение не считало неделями
        decision: D-289
      - key: orbit.approach_radii
        value: 4
        unit: радиусов стоянки
        note: Ближе этого от планеты автопилот бросает дугу и подгоняет скорость под круг, какой бы она ни была; дальше он тормозит только по тормозному пути. К корпусу-цели (волна 3) границы нет, профиль сближения с первой минуты
        decision: D-289
      - key: orbit.late_leg_days
        value: 0.25
        unit: суток
        note: Если час прихода прошёл, а планеты нет, следующая дуга кладётся на скорости корпуса и не короче этого
        decision: D-289
      - key: orbit.sight_radius
        value: 5
        unit: ед. карты
        note: Ближе этого чужие корпуса видны на карте рубки; на стоянке у одной планеты видны всегда
        decision: D-289
      - key: orbit.dock_radius
        value: 0.2
        unit: ед. карты
        note: Ближе этого при допуске по скорости начинается удержание — корпуса летят как один
        decision: D-289
      - key: orbit.dock_speed
        value: 0.5
        unit: ед. карты/сутки
        note: Допуск по относительной скорости для удержания и стыковки
        decision: D-289
      - key: orbit.slider_from_hours
        value: 2
        unit: часов
        note: Самая короткая дуга, которую предлагает ползунок. Быстрее этого небо не спрашивают
        decision: D-271
      - key: orbit.slider_step
        value: 10
        unit: "% времени"
        note: Шаг ползунка между соседними дугами, долей времени полёта. Меньше шаг — плотнее кривая и дороже расчёт
        decision: D-271
      - key: orbit.calendar_step
        value: 25
        unit: "% времени"
        note: Шаг перебора для календаря коридора на карте. Грубее ползунка нарочно — это картина окна, не котировка
        decision: D-271
      - key: orbit.calendar_days
        value: 60
        unit: суток
        note: На сколько суток вперёд карта показывает календарь дешёвого рейса. Столько же клиент прокручивает небо
        decision: D-271

  - id: quality
    title: Качество
    constants:
      - key: quality.scale
        value: {min: 0, max: 100}
      - key: quality.tiers
        value:
          - {from: 0, to: 19, name: скверное}
          - {from: 20, to: 39, name: плохое}
          - {from: 40, to: 59, name: обычное}
          - {from: 60, to: 79, name: хорошее}
          - {from: 80, to: 100, name: отличное}
      - key: quality.durability_factor
        formula: "base_life * (0.5 + quality / 80)"
        note: Качество 80 служит вдвое дольше качества 40
      - key: quality.spread_good_ratio
        value: 5
        unit: "±"
        note: Разброс результата при верных пропорциях
      - key: quality.spread_bad_ratio
        value: 20
        unit: "±"
        note: Разброс результата при неверных пропорциях
      - key: quality.repair_ceiling_loss
        value: -8
        note: К потолку состояния за каждый ремонт
      - key: quality.material_weight
        value: 60
        unit: "%"
        note: Вклад качества входов в приближение к потолку. У сборок — все 100
        decision: D-092
      - key: quality.ratio_weight
        value: 40
        unit: "%"
        note: Вклад точности пропорций. Только у рецептов-смесей (mix)
        decision: D-092
      - key: quality.hand_craft_bonus
        value: 10
        unit: "до +"
        note: Премия за точное попадание в пропорции — адаптивность ручного ремесла

  - id: death
    title: Смерть и печать
    constants:
      - key: death.iron_cost
        value: 10
        unit: ед. железа
        decision: D-033
      - key: death.print_time_city
        value: 3
        unit: минуты
      - key: death.print_time_capital
        value: 12
        unit: часов
        decision: D-028
      - key: death.first_body_instant
        value: true
        note: Первое тело печатается мгновенно
        decision: D-040
      - key: death.salvage_ratio
        value: 30
        unit: "%"
        note: Носимого уцелевает на месте гибели, с потерей состояния
      - key: death.nymph_grow_multiplier
        value: 2
        unit: "×"
        note: Тела нимф растут дольше

  - id: bank
    title: Деньги и банк
    constants:
      # Года в мире нет: сутки Терры тридцатичасовые, и «годовых» не от чего
      # считать. Число банковское, а не астрономическое (D-167)
      - key: bank.year_days
        value: 360
        unit: суток
        note: Расчётный год для пересчёта ставки в суточные проценты
        decision: D-167
      - key: bank.base_rate
        value: 5
        unit: "% годовых"
        note: В пересчёте на игровые сутки
      - key: bank.target_inflation
        value: 2
        unit: "% за 30 суток"
      - key: bank.rate_reaction_k
        value: 1.5
        note: Коэффициент реакции ставки на отклонение инфляции
      - key: bank.rate_review_period
        value: 3
        unit: суток
      - key: bank.risk_premium
        value: {min: 2, max: 8}
        unit: "%"
        note: В зависимости от истории заёмщика
      - key: bank.unsecured_limit
        value: 200
        unit: ТК
        note: Без залога при чистой истории
      - key: coin.gold_per_coin
        value: 1
        unit: г
      - key: coin.silver_per_coin
        value: 5
        unit: г
      - key: coin.default_fineness
        value: 900
        note: >-
          Одна на весь мир: состав монеты задан самим рецептом — 0.9
          аффинированного металла и 0.1 слитка железа лигатурой, — и выбора
          у эмитента нет

  # Контур денежного регулирования (D-087): датчики, рычаги и их границы.
  # Всё, что здесь перечислено, публично и показывается игрокам.
  - id: money_loop
    title: Регулирование денежного оборота
    constants:
      - key: bank.price_index_window
        value: 10
        unit: суток
        note: Окно, по которому считается медиана сделок в индексе цен
        decision: D-087
      - key: bank.rate_floor
        value: 1
        unit: "% годовых"
        note: Ниже ставка не опускается даже при дефляции
        decision: D-087
      - key: bank.rate_cap
        value: 40
        unit: "% годовых"
        decision: D-087
      - key: bank.rate_step_max
        value: 2
        unit: п.п. за пересмотр
        note: Ставка не прыгает — коридор проходится за несколько пересмотров
        decision: D-087
      - key: bank.emission_reaction_k
        value: 0.5
        note: Коэффициент реакции ставки на долю эмиссии в выдаче
        decision: D-087
      - key: bank.emission_share_target
        value: 20
        unit: "%"
        note: Целевая доля напечатанного в общей выдаче кредитов
        decision: D-087
      - key: bank.emission_share_alarm
        value: 60
        unit: "%"
        note: Выше — аварийный режим, ставка идёт вверх максимальным шагом
        decision: D-087
      - key: bank.inflation_alarm
        value: 10
        unit: "% за 30 суток"
        note: Отклонение в любую сторону, при котором руль возвращается алгоритму
        decision: D-087
      - key: bank.reserve_target
        value: 15
        unit: "% оборотной массы"
        note: Ниже — выдача печатает недостающее, выше — печать не нужна
        decision: D-087
      - key: bank.reserve_cap
        value: 30
        unit: "% оборотной массы"
        note: Излишек сверх этого сжигается. Единственный способ уменьшить массу ТК
        decision: D-087
      - key: bank.income_withheld_share
        value: 50
        unit: "%"
        note: "Столько столица удерживает с каждого поступления в казну города-должника, пока тот не рассчитается по просроченному займу. Доля с прихода, а не разовый сбор остатка: сметённый остаток город держит нулевым и не платит вовсе, а половина выручки взыскивается, пока город живёт, и позволяет ему жить"
        decision: D-285
      - key: bank.city_margin_cap
        value: 8
        unit: "%"
        note: Потолок маржи городского банка сверх ключевой. Города конкурируют ставкой, но монополист свою не задерёт
        decision: D-175
      - key: bank.council_handover_cities
        value: 5
        unit: городов
        note: Столько городов с администрацией — и ставка переходит Совету городов
        decision: D-087
      - key: bank.council_rate_deviation
        value: 3
        unit: п.п.
        note: Насколько Совет вправе отклониться от рекомендации алгоритма
        decision: D-087
      - key: bank.council_lockout
        value: 10
        unit: суток
        note: На столько ставка возвращается алгоритму после аварийного порога
        decision: D-087

  # Фонд общественных работ (D-248): процентный доход возвращается в мир
  # оплатой проверяемого труда, а не сжигается. Всё публично, как и банк.
  - id: works
    title: Фонд общественных работ и госзаказ
    constants:
      - key: works.recycle_ramp
        value: 2
        unit: п.п. ниже цели инфляции
        note: На столько инфляция должна уйти ниже цели, чтобы весь излишек резерва шёл в фонд, а не сжигался; между целью и порогом — линейно
        decision: D-248
      - key: works.print_cap
        value: 0
        unit: "% оборотной массы в сутки"
        note: Потолок печати ЦБ в фонд при дефляции. Ноль — кран заложен, но закрыт; открывается по телеметрии
        decision: D-248
      # Эмиссия по подписям (D-270): заявка живёт сутки, печатает половина
      # держателей права. Потолка суммы нет — тормоз подписи и ставка
      - key: emission.proposal_hours
        value: 24
        unit: ч
        note: Срок заявки на эмиссию. Не собрала подписей — истекает, и следующая заявка её сменяет
        decision: D-270
      - key: emission.signature_share
        value: 50
        unit: "% держателей права"
        note: Доля держателей права «эмиссия», чьих подписей хватает, чтобы напечатать. Один держатель печатает сам
        decision: D-270
      - key: works.hour_rate
        value: 3
        unit: ТК за час работ
        note: Трудовой тариф госзаказа. Держится ниже рыночного заработка, иначе госзаказ высасывает людей с рынка
        decision: D-248
      - key: works.road_threshold
        value: 60
        unit: пунктов состояния
        note: Покрытие ребра ниже — движок вешает автоматический заказ на обслуживание
        decision: D-248
      - key: works.city_cofinance
        value: 50
        unit: "%"
        note: Доля трудового тарифа городского заказа, которую платит сам город; фонд доплачивает остальное. Задел под городские заказы (волна 3 D-248), кодом пока не читается
        decision: D-248
      - key: works.object_cooldown
        value: 5
        unit: суток
        note: Один объект не порождает второй оплачиваемый заказ раньше этого срока
        decision: D-248
      - key: works.player_daily_cap
        value: 30
        unit: ТК в сутки
        note: Потолок выплат фонда одному игроку
        decision: D-248
      - key: works.order_deadline
        value: 2
        unit: суток
        note: Срок брони городского заказа, после него заказ возвращается на доску. Дорожные заказы без брони — платят первому завершившему. Задел под бронь (волна 3+ D-248), кодом пока не читается
        decision: D-248
      - key: works.haul_kg_per_hour
        value: 25
        unit: кг в час
        note: Норма подвоза для трудового тарифа доставки топлива — часы считаются из веса груза
        decision: D-248

  - id: debt
    title: Долг и несостоятельность
    constants:
      - key: debt.grace_period
        value: 7
        unit: суток
        note: Просрочки до санкций
      - key: debt.prison_threshold
        value: 14
        unit: суток
        note: Долг превышает оценку всего имущества и не обслуживается столько суток
      - key: debt.workoff_rate
        value: 30
        unit: "% дохода"
        note: Уходит в погашение автоматически
      - key: debt.max_body_debt
        value: 5
        unit: печатей
        note: Непогашенных — дальше только бесплатная печать в столице

  - id: breed
    title: Селекция
    constants:
      - key: breed.inherit_drift
        formula: "mean(parents) ± 0.15 * spread(parents)"
        note: Признак потомка
      - key: breed.novel_trait_chance
        value: 5
        unit: "%"
        note: На появление признака, которого не было у родителей
      - key: breed.novel_trait_shift
        value: 25
        unit: "%"
        note: Сдвиг нового признака от середины. Больше порога различимости
          с запасом и не привязан к дрейфу наследования
        decision: D-260
      - key: breed.wild_traits
        value: {yield_per_m2: 0.6, hardiness: 1.25, density_risk: 0.8, disease_risk: 0.8}
        unit: множители к базовому сорту
        note: Признаки дикого предка от базовых. Урожай ниже, выносливость
          выше, тесноты боится меньше (D-297) — второй родитель для скрещивания
        decision: D-260
      - key: breed.hybrid_vigor
        value: 20
        unit: "% силы партии"
        note: Гетерозис партии F1 из питомника сверх сотни. Живёт ровно один
          посев — потомство не выше 100
        decision: D-260
      - key: breed.generations_to_stabilize
        value: {min: 4, max: 6}
        unit: поколений
        note: Отбора
      - key: breed.distinctness_threshold
        value: 15
        unit: "%"
        note: Новый сорт жизнеспособен, если отличается от ближайшего не меньше чем на столько по совокупности признаков
      - key: breed.degradation_per_gen
        value: -3
        unit: "%"
        note: К показателям за поколение пересева без отбора
      - key: breed.hybrid_decay
        value: -25
        unit: "%"
        note: К показателям у потомства гибрида

  - id: invent
    title: Изобретение
    constants:
      - key: invent.exact_match_required
        value: true
        note: Засчитывается только точное совпадение состава
        decision: D-064
      - key: invent.max_ingredients
        value: 5
        note: Потолок числа компонентов в изобретаемом рецепте
      - key: invent.material_loss
        value: {min: 20, max: 80}
        unit: "%"
        note: При неудаче сгорает случайная доля выложенного — своя у каждой
          вещи состава, ровно между этими краями. Цена попытки, а не казнь
        decision: D-209
      - key: invent.attempt_time
        formula: "craft_time(item_of_same_level)"

  - id: carrier
    title: Носитель рецепта
    constants:
      - key: carrier.write_seconds
        value: {min: 0.1, max: 300}
        unit: секунд
        note: Время записи одного рецепта на болванку по её качеству — прямая
          от max при качестве 0 (1 % — почти пять минут) до min при качестве 100
        decision: D-209
      - key: carrier.write_wear
        value: 5
        unit: "%"
        note: Сколько качества болванка теряет за запись. Стартовое число, правится на игре
        decision: D-209
      - key: carrier.wipe_wear
        value: 5
        unit: "%"
        note: Сколько качества носитель теряет за стирание. Болванка с качеством 0
          мертва — записать на неё уже нельзя
        decision: D-209

  - id: trial
    title: Ограничения бесплатного аккаунта
    constants:
      - key: trial.duration
        value: 30
        unit: суток
        note: После истечения — заморозка бюджета передачи на базовом, не стена
        decision: D-273
      - key: trial.transfer_limit_base
        value: 500
        unit: ТК в сутки
        note: Эквивалента
      - key: trial.transfer_limit_growth
        value: 10
        unit: "%"
        note: За каждые сутки активной игры
      - key: trial.transfer_limit_cap
        value: 20
        unit: "×"
        note: К базовому лимиту
      - key: trial.market_unlimited
        value: true
        note: Продажа на маркетплейсе не ограничивается
        decision: D-041

  - id: subscription
    title: Подписка и оплата
    constants:
      - key: subscription.price_month
        value: 9.99
        unit: USD или EUR в месяц
        decision: D-274
      - key: subscription.price_quarter_month
        value: 8.99
        unit: в месяц при оплате за квартал
        decision: D-274
      - key: subscription.price_year_month
        value: 6.99
        unit: в месяц при оплате за год
        decision: D-274
      - key: subscription.share_cis
        value: 50
        unit: "%"
        note: Доля от мировой цены для СНГ
        decision: D-274
      - key: subscription.price_month_rub
        value: 449
        unit: ₽ в месяц
        decision: D-274
      - key: subscription.alt_discount
        value: 50
        unit: "%"
        note: Скидка на второй и следующие аккаунты одного человека
        decision: D-274
      - key: subscription.ru_acquiring_threshold
        value: 300
        unit: платящих из РФ
        note: Порог, после которого заводится свой российский эквайринг
        decision: D-275
      - key: supporter.badge_price
        value: 15
        unit: USD, разово
        note: Значок сторонника альфы — только идентичность, без преимущества
        decision: D-276

  - id: chat
    title: Общение
    constants:
      - key: chat.leak_base
        value: 8
        unit: "%"
        note: Вероятность, что реплика долетит до соседней группы
      - key: chat.leak_per_person
        value: 1
        unit: "%"
        note: За каждого человека в локации сверх `chat.leak_crowd_free`
      - key: chat.leak_crowd_free
        value: 4
        unit: человека
        note: Сколько людей в локации не добавляют шума. Порог был зашит в примечании — движку нужно число
      - key: chat.leak_group_size
        value: 2
        unit: "%"
        note: За каждого участника группы сверх `chat.leak_group_free`
      - key: chat.leak_group_free
        value: 3
        unit: участника
        note: Какая группа говорит не громче одного. Порог был зашит в примечании — движку нужно число
      - key: chat.leak_quiet_multiplier
        value: 0.3
        unit: "×"
        note: При речи вполголоса
      # Ключи — классы вещей (D-215, D-291): место узнаётся по тому, что в
      # нём стоит, и вторая кузница глушит без правки кода. Когда стоит
      # и шумное, и тихое, берётся меньший множитель — шум сильнее тишины
      - key: chat.leak_location_modifier
        value:
          Кузница: 0.5
          Библиотека: 1.5
        unit: "×"
        note: Шумно / тихо, по классу стоящей вещи
        decision: D-291
      - key: chat.city_record_retention
        value: 30
        unit: суток
        note: Срок хранения городских записей. Сам факт ограничения — часть решения, а не настройка
        decision: D-081

  - id: market
    title: Маркетплейс
    constants:
      # Бак терминала (D-255): жидкость торгуется из него и в него, и ячейки
      # за прилавком — его нутро. Ликвидность рынка жидкостей упирается в эту
      # ёмкость: город, которому тесно, строит терминал побольше — когда
      # появятся терминалы побольше
      - key: market.tank_capacity
        value: 2000
        unit: кг
        note: Сколько жидкости держит бак терминала — на все ячейки разом. Продажа наливает, покупка сливает, купленное без тары ждёт внутри
        decision: D-255
      - key: market.order_lifetime
        value: 14
        unit: суток
        note: До истечения ордера
      - key: market.reservation_deposit
        value: 20
        unit: "%"
        note: Суммы задатком
      - key: market.reservation_period
        value: 3
        unit: суток
        note: На то, чтобы забрать
      - key: market.default_fee
        value: 2
        unit: "%"
        note: С оборота вне городской юрисдикции

  - id: market_orphan
    title: Осиротевший маркетплейс
    constants:
      - key: market.orphan_decay_multiplier
        value: 5
        unit: "×"
        note: Во столько раз быстрее портится товар, брошенный в несодержащемся терминале
        decision: D-100

  - id: time
    title: Время и логистика
    constants:
      - key: time.tick
        value: 1
        unit: минута
      - key: time.day_terra
        value: 38
        unit: ч
      - key: time.day_aquatica
        value: 14
        unit: ч
      - key: time.day_pyroxis
        value: 46
        unit: ч
      - key: time.day_aurora
        value: 33
        unit: ч
      - key: travel.city_step
        value: {min: 4, max: 10}
        unit: секунд
        note: Один шаг между соседними локациями города
        decision: D-089
      - key: travel.intra_city
        value: {min: 20, max: 60}
        unit: секунд
        note: Центр и окраина города — три-пять шагов
      # Первое кольцо за стенами: ближняя шахта в двадцати секундах, а не в
      # двадцати минутах. Дальше каждое кольцо дороже предыдущего (D-180)
      - key: travel.frontier_step
        value: 20
        unit: секунд
        note: Переход к узлу дали 1 — первому за стенами города
        decision: D-180
      - key: travel.frontier_growth
        value: 1.8
        unit: раз
        note: Во столько раз длиннее переход к каждому следующему кольцу дали
        decision: D-180
      - key: travel.interplanetary
        value: {min: 2, max: 8}
        unit: суток
        note: По таблице маршрутов
        decision: D-009
      - key: comm.delay_interplanetary
        value: {min: 1, max: 5}
        unit: секунд
        note: "Задано D-010, пересмотрено D-222: переписка идёт с задержкой от пути, и движок эту вилку больше не читает"
        decision: D-010
      # Переписка в Сети идёт с задержкой, пропорциональной пути между
      # собеседниками (D-222): секунды кратчайшего маршрута пешком по дорогам,
      # между планетами — время перелёта по орбитам на этот час. Внутри города
      # выходят секунды, между городами минуты, между планетами — часы
      - key: comm.delay_per_second
        value: 0.05
        unit: секунд задержки на секунду пути
        note: "Во сколько секунд задержки обходится секунда пути между собеседниками. Ноль — мгновенная связь, как было по D-010"
        decision: D-222
      # Дорога стоит выносливости (D-147). Расход идёт от времени, а не от
      # числа переходов: иначе шаг по кварталу дороже дальнего перехода
      - key: travel.stamina_per_hour
        value: 2
        unit: ед./час
        note: Расход выносливости за час пешего перехода. Дорога утомляет, но кормит не она
        decision: D-147

  # Планировка города (D-089): постройка = узел, город растёт кольцами от биопринтера
  - id: city
    title: Планировка города
    constants:
      - key: city.rings_reserved
        value: 1
        unit: кольцо
        note: Сколько колец вокруг биопринтера отдано обязательным городским постройкам
        decision: D-089
      - key: city.ring_slots_base
        value: 6
        unit: мест
        note: Участков в первом кольце
        decision: D-089
      - key: city.ring_slots_growth
        value: 6
        unit: мест за кольцо
        note: Дальняя окружность длиннее — мест на ней больше
        decision: D-089
      # Расстояние меряется узлами по графу, а не кольцами: кольцо — свойство,
      # записанное при генерации, а узлы — то, чем город ходят на самом деле.
      # Одно число на оба вопроса о цене места (D-220): и выкуп участка, и
      # земельный налог убывают одинаково, потому что говорят об одном и том же
      - key: land.decay_per_node
        value: 35
        unit: "%"
        note: На столько дешевеет земля с каждым узлом от биопринтера — и в выкупе, и в налоге. Это запрос города, а не цена движка
        decision: D-220
      - key: land.area_ring1
        value: {min: 60, max: 140}
        unit: м²
        note: Площадь участка в первом кольце. Разыгрывается при появлении узла
        decision: D-125
      - key: land.area_growth_per_ring
        value: 30
        unit: "%"
        note: На столько просторнее участки с каждым кольцом от центра. В центре тесно всегда
        decision: D-125
      - key: treasury.grace_days
        value: 3
        unit: суток
        note: Столько город живёт с пустой казной, прежде чем начинает сыпаться
        decision: D-127

  # Свойства места: разыгрываются при генерации, идеального места не бывает (D-126)
  - id: site
    title: Свойства места
    constants:
      - key: site.temp_range
        value: {min: -15, max: 35}
        unit: °C
        note: Средняя температура места. Задаёт, что здесь вообще родится
        decision: D-126
      - key: site.rain_range
        value: {min: 0, max: 100}
        unit: осадков
        note: Условная шкала. Сухая пустошь против дождливой поймы
        decision: D-126
      - key: site.rain_water_offset
        value: 60
        unit: "%"
        note: Столько испарения закрывает дождь при максимуме осадков (D-296;
          прежде — долю полива). Сухое место поливают руками
        decision: D-126
      - key: planet.temp_swing
        value: {terra: 5, aquatica: 3, aurora: 18, pyroxis: 25}
        unit: "°C"
        note: Суточное качание температуры вокруг среднего узла. Полдень — пик,
          полночь — дно
        decision: D-261
      - key: explore.near_drift
        value: {temperature: 5, precipitation: 15, kinship: 75}
        unit: смешанная
        note: Поиск «ближе» — температура и осадки от истока с этим отклонением,
          местность с вероятностью родства повторяет исток. «Дальше» — независимый бросок
        decision: D-262
      - key: site.river_share
        value: 25
        unit: "% мест"
        note: Доля мест у реки. Даёт воду и водяное колесо
        decision: D-126
      - key: site.coast_share
        value: 15
        unit: "% мест"
        note: Доля мест у моря. Даёт порт и морские рёбра графа
        decision: D-126
      # Лес (D-144). Входит в бюджет достоинств наравне с рекой и плодородием:
      # лесистый узел за это платит теснотой под пашню
      - key: site.forest_share
        value: {min: 0, max: 100}
        unit: "%"
        note: Лесистость узла. Разыгрывается при генерации и тратит `site.quality_budget`
        decision: D-144
      - key: forest.stock_per_share
        value: 40
        unit: ед. дерева на % лесистости
        note: Полностью лесистый узел держит 4000 дерева — около двух недель работы одного лесоруба
        decision: D-144
      - key: forest.regrow_per_day
        value: 1.5
        unit: "% запаса в сутки"
        note: Отрастание. Множится на осадки узла — сухой лес восстанавливается вдвое дольше дождливого
        decision: D-144
      - key: site.quality_budget
        value: 10
        unit: баллов
        note: Суммарная доброта свойств при розыгрыше. Место, хорошее во всём, не выпадает никогда
        decision: D-126

  # Разведка (D-152): карта прирастает ногами, а не патчем. Найденное ничьё —
  # право первой ночи, а не право собственности
  - id: explore
    title: Разведка
    constants:
      # Цена захода зависит от места, а не от игрока (D-156): нехоженая
      # окрестность отдаёт находку за минуты, исхоженная — за часы и не всегда
      - key: explore.attempt_minutes
        value: {min: 1, max: 5}
        unit: минут
        note: "Заход по нехоженой окрестности. Первая находка — минуты: карта обязана расти сразу"
        decision: D-156
      - key: explore.attempt_hours
        value: 3
        unit: ч
        note: Потолок длительности захода. Дальше истощение окрестности времени не добавляет
        decision: D-156
      - key: explore.effort_growth
        value: 2
        unit: "×"
        note: Во столько раз длиннее каждый следующий заход от того же узла
        decision: D-156
      - key: explore.attempt_stamina
        value: 12
        unit: ед.
        note: "Расход на заход полной длины. Короткий стоит по времени в поле: разведка — работа, а не прогулка. Он же порог: без цены самого долгого захода отсюда в поле не выходят (D-293)"
        decision: D-156
      - key: explore.find_chance
        value: 90
        unit: "%"
        note: Шанс захода по нехоженому месту. Первые находки почти верные, иначе карта не растёт вовсе
        decision: D-156
      - key: explore.find_decay
        value: 0.88
        unit: "×"
        note: Во столько раз падает шанс с каждой находкой от этого узла. Пустой заход — норма исхоженного места
        decision: D-156
      - key: explore.find_floor
        value: 15
        unit: "%"
        note: "Ниже этого шанс не падает: исхоженная окрестность беднеет, но не запирается насовсем"
        decision: D-156
      # Теснота графа (D-207). Мера подобрана по затравочной столице: её выход
      # держит шесть дорог, соседи добавляют до девяти единиц — обжитой город
      # обязан оставаться нормой, иначе штраф достаётся новичку на первом заходе.
      # Дальше каждое ребро сверх нормы отнимает десятую часть шанса, и звезда
      # на двадцать шесть рёбер ищет впятеро хуже свободного узла
      - key: explore.crowding_free
        value: 10
        unit: единиц тесноты
        note: Столько тесноты якорю прощается. Обжитой город с десятком дорог — норма, звезда — нет
        decision: D-207
      - key: explore.crowding_neighbour_k
        value: 0.5
        unit: "×"
        note: С каким весом считаются лишние рёбра соседей. Цепочка узлов тесноты не создаёт, скопление создаёт
        decision: D-207
      - key: explore.crowding_decay
        value: 0.9
        unit: "×"
        note: Во столько раз падает шанс за каждую единицу тесноты сверх нормы
        decision: D-207
      - key: explore.crowding_floor
        value: 20
        unit: "% шанса"
        note: "Ниже этой доли теснота шанс не сбивает: тесное место ищет плохо, но ищет"
        decision: D-207
      - key: explore.vein_share
        value: 40
        unit: "% находок"
        note: Какая доля находок несёт жилу. Остальное — участки под застройку
        decision: D-152
      # Лесистость мира: и доля находок с лесом, и во столько же раз уже шанс
      # при прицельном поиске леса (D-191)
      - key: explore.forest_share
        value: 35
        unit: "% находок"
        note: Какая доля находок несёт лес. Дерево — первый материал лестницы, и упираться в него нельзя
        decision: D-191
      # Камни и луг — такие же свойства места, как лес (D-196). Своих операций
      # у них больше нет (D-210): знаки ждут роли множителей к таблице находок
      - key: explore.stones_share
        value: 30
        unit: "% находок"
        note: Какая доля находок каменистая. Знак места; своей механики пока не имеет (D-210)
        decision: D-196
      - key: explore.meadow_share
        value: 40
        unit: "% находок"
        note: Какая доля находок луговая. Знак места; своей механики пока не имеет (D-210)
        decision: D-196
      - key: explore.node_area
        value: {min: 120, max: 600}
        unit: м²
        note: Площадь найденного участка. За стенами просторнее, чем в кольцах
        decision: D-152
      # Длину перехода к находке задаёт даль узла (D-180): explore.distance
      # упразднён — расстояние росло бы вслепую, одинаково у первого кольца
      # и у края карты
      - key: explore.vein_richness
        value: {min: 20, max: 80}
        unit: богатства
        note: "Богатство найденной жилы. Верх ниже ста: идеальной жилы не находят"
        decision: D-152
      - key: explore.vein_stock
        value: {min: 8000, max: 60000}
        unit: единиц
        note: Запас найденной жилы. Жилы конечны, и это неотменяемо
        decision: D-152

  # Собирательство (D-210): пустая земля участка отдаёт случайную находку.
  # Что найдётся, игрок не выбирает; коэффициент вещи отвечает и за «как
  # часто», и за «как быстро». Числа ПРОБНЫЕ — стартовая прикидка, не плейтест
  # Разведка Авроры (D-232): внутри города раскрываются существующие
  # помещения, по ледяным равнинам находятся новые промёрзшие города. Числа
  # стартовые: содержимое комнат — то, что в этом мире уже есть, а чертежи,
  # катализаторы и артефакты приходят с раскопочным контентом (Э6, пункт 6)
  - id: ruins
    title: Разведка Предтеч
    constants:
      - key: ruins.city_rooms
        value: 24
        unit: помещений
        note: Запас помещений города. Чем больше раскрыто, тем чаще пусто; кончился запас — город выработан, как жила, и вскрывать в нём больше нечего
        decision: D-232
      - key: ruins.room_types
        value:
          столица:
            архив: 4
            квартира: 2
            склад: 2
            тоннель: 3
            цех: 1
          цех:
            цех: 4
            склад: 3
            тоннель: 3
            архив: 1
            квартира: 1
          улей:
            квартира: 5
            склад: 2
            тоннель: 3
            архив: 1
            цех: 1
        note: Какие помещения попадаются в городе, по его роду. Мерид — архивы, Кальдар — цеха, Вейр — квартиры
        decision: D-232
      - key: ruins.room_finds
        value:
          архив:
            Стекло: 3
            Медный слиток: 2
            Ткань: 1
          цех:
            Сталь: 3
            Труба: 2
            Стальная рама: 1
          квартира:
            Ткань: 3
            Глиняный горшок: 2
            Стекло: 1
          склад:
            Уголь: 3
            Сталь: 2
            Стекло: 1
          тоннель:
            Камень: 4
            Уголь: 2
        note: Что лежит в раскрытом помещении, по его типу. Стартовый набор из того, что в мире уже есть
        decision: D-232
      - key: ruins.room_haul
        value: {min: 2, max: 8}
        unit: единиц
        note: Сколько единиц лежит в помещении. Глубина умножает — дальше от космодрома ценнее
        decision: D-061
      - key: ruins.depth_bonus
        value: 0.25
        unit: доля за шаг
        note: Насколько богаче помещение за каждый шаг вглубь от космодрома
        decision: D-061
      - key: ruins.new_city_age
        value: 2
        unit: жизни реактора
        note: Во сколько раз давнее года реактора запущен реактор найденного города. Он давно мёртв, и маяк тёмный
        decision: D-232

  - id: forage
    title: Собирательство
    constants:
      - key: forage.min_area
        value: 30
        unit: м²
        note: "Меньше пустой земли — собирать негде: окно не показывается. Пустая земля = участок минус пятно застройки"
        decision: D-210
      - key: forage.reference_area
        value: 100
        unit: м²
        note: Опорная пустая площадь, на которую заданы темпы `forage.finds`. Вдвое больше земли — вдвое быстрее
        decision: D-210
      # Темп на вещь: находок в час на опорной площади. Сумма даёт скорость
      # поиска, доля в сумме — что именно найдётся. Числа лежат в реестре
      # материалов (поле `forage` у вещи, D-215): есть поле — вещь лежит на
      # поверхности и находится; сборка наполняет обе таблицы сама
      - key: forage.finds
        value_from: materials
        unit: находок в час на forage.reference_area
        note: Коэффициент нахождения каждой вещи. Задать `forage` материалу — вещь начнёт находиться без правки кода
        decision: D-210
      # Горсть: сколько единиц приносит одна находка. Ключи те же, что у
      # forage.finds, — движок проверяет совпадение при старте
      - key: forage.handful
        value_from: materials
        unit: единиц за находку
        note: Одна находка — одна горсть одной вещи. Меньше единицы не бывает
        decision: D-210
      # Где вещь лежит: свойство места из vocabulary.yaml, то же слово, что
      # `place` у операции (D-177). Ключи — подмножество forage.finds; вещь
      # без записи находится везде. Наполняется сборкой из реестра материалов
      - key: forage.place
        value_from: materials
        unit: свойство узла
        note: "Голая земля не кормит: узел, свойства которого не дают ничего, окна сбора не имеет"
        decision: D-254
      # Дикие семена (D-254): общий темп на все восемь культур. Доля культуры
      # НЕ ЗАДАЁТСЯ — она обратна требованию к плодородию, так что сорняк
      # попадается чаще сахарника; горсть тоже выводится, `farm.seed_rate ×
      # farm.plot_min_area` — ровно на одну минимальную делянку
      - key: forage.wild_seeds
        value: 4
        unit: находок в час на forage.reference_area
        note: "Первое семя собирается руками, дальше фермер живёт своим фондом. Находятся на лугу базовым сортом"
        decision: D-254
      - key: forage.search_floor
        value: 20
        unit: сек
        note: "Быстрее этого поиск не идёт, сколько бы ни было земли: находка — это всё-таки прогулка"
        decision: D-210
      - key: forage.search_jitter
        value: {min: 0.7, max: 1.3}
        unit: "×"
        note: Разброс длительности одного поиска вокруг расчётной. Одинаковые сроки читались бы как таймер
        decision: D-210
      # Цена за поиск, а не за час: находок в час на большой земле больше, и
      # платится за каждую — площадь покупает время, а не дармовые вещи
      - key: forage.search_stamina
        value: 1
        unit: ед. за поиск
        note: "Столько сил уходит на один поиск, найден он или пропущен. Без сил не ищут"
        decision: D-210
      # Треугольное распределение: вершина посередине шкалы, края редки
      - key: forage.quality
        value: {min: 10, max: 90}
        unit: качества
        note: "Качество найденного: чаще среднее (вершина в середине отрезка), крайности редки; идеал даёт жила"
        decision: D-210

  # Кредитный лимит считается из труда, а не из имущества (D-173): оборот
  # нельзя нарисовать, не продав настоящий товар настоящему покупателю
  - id: credit
    title: Кредитный лимит
    constants:
      - key: credit.turnover_share
        value: 25
        unit: "%"
        note: Столько лимита даёт личный оборот продаж за окно
        decision: D-173
      - key: credit.interest_share
        value: 80
        unit: "%"
        note: "Столько лимита даёт уплаченный процент по займам. Кредитная история — актив, но актив — обслуживание, а не оборот: тело возвращённого займа считалось до D-280, и взять-вернуть в ту же секунду поднимало лимит даром"
        decision: D-280
      - key: credit.window
        value: 30
        unit: суток
        note: Окно личного оборота для лимита
        decision: D-173
      - key: credit.no_overdue_bonus
        value: 20
        unit: "%"
        note: Прибавка к лимиту за стаж без просрочек. Время — множитель, а не основа
        decision: D-173
      - key: credit.report_penalty
        value: 10
        unit: "%"
        note: На столько каждый активный репорт «дефектная печать» снижает доверие
        decision: D-173
      - key: credit.trust_floor
        value: 20
        unit: "%"
        note: "Ниже этого доверие не падает: репорты режут кредит, а не хоронят человека"
        decision: D-173
      - key: credit.city_base
        value: 5000
        unit: ТК
        note: "База кредитного потолка города: столько он может занять у столицы, ещё ничего не наторговав и ничего не уплатив. Хватает на несколько небольших займов своим гражданам — молодой город кредитует, но скромно"
        decision: D-285
      - key: credit.city_turnover_share
        value: 25
        unit: "%"
        note: "Столько потолка города даёт торговый оборот на его земле за окно. Как у гражданина: мерка одна"
        decision: D-285
      - key: credit.city_interest_share
        value: 80
        unit: "%"
        note: "Столько потолка города даёт процент, уплаченный им столице. Как у гражданина: кредитная история — это обслуживание, а не оборот"
        decision: D-285
      - key: credit.city_overdue_penalty
        value: 25
        unit: "%"
        note: "На столько каждый непогашенный просроченный заём снижает доверие города. Жёстче, чем репорт гражданину (10 %), и намеренно: жалоба — чужое слово и бывает напраслиной, а просрочка — собственное действие города, отрицать нечего. Четыре просрочки роняют доверие в пол"
        decision: D-285
      - key: credit.city_trust_floor
        value: 20
        unit: "%"
        note: "Ниже этого доверие города не падает: просрочка сужает кредит, но не хоронит город"
        decision: D-285

  # Содержание постройки упразднено (D-219): за землю платят земельным налогом,
  # а дом изнашивается порчей и чинится материалами. Осталась порча припасов —
  # сток того же рода, но про вещи, а не про здания
  - id: spoilage
    title: Порча припасов
    constants:
      - key: spoilage.food_base
        value: 5
        unit: "% в сутки"
      - key: spoilage.cold_storage_multiplier
        value: 0.2
        unit: "×"
      - key: spoilage.salted_multiplier
        value: 0.05
        unit: "×"
      - key: wear.tool_per_session
        value: 3
        unit: "% состояния"
        note: За сессию добычи
      - key: wear.gear_per_day
        value: 2
        unit: "% состояния"
        note: Снаряжение изнашивается от ношения. Сток С2
        decision: D-129
      - key: wear.environment_k
        value: {Терра: 1, Акватика: 2, Аврора: 3, Пироксис: 4}
        unit: "×"
        note: Множитель износа снаряжения от среды. Пироксис дорог сам по себе
        decision: D-129
      - key: wear.station_per_batch
        value: 0.5
        unit: "% состояния"
        note: Рабочая станция изнашивается за партию. Содержание обязательно
        decision: D-129
      - key: wear.transport_per_leg
        value: 1.5
        unit: "% состояния"
        note: Транспорт за переход между узлами, с поправкой на загрузку
        decision: D-129

  # Обещанные документами величины, которых до сих пор не было в реестре.
  # Найдено машинной проверкой ссылок: документ ссылался на несуществующий ключ.
  - id: promised
    title: Прочее
    constants:
      - key: map.nodes_terra
        value: 120
        unit: узлов
        note: Правится под фактический онлайн, а не обсуждается (D-065)
      - key: map.nodes_space
        value: 18
        unit: узлов
        note: Столько, чтобы перехват и блокада были возможны
      - key: map.shrink_threshold
        value: 20
        unit: "% онлайна"
        note: Ниже — дальние регионы мягко закрываются, карта уплотняется
      - key: mining.gold_per_hour
        value: 4
        unit: ед./час
        note: Темп добычи золота. Задаёт рост денежной базы — следить пристальнее всего
      - key: mining.silver_per_hour
        value: 12
        unit: ед./час
      - key: inventory.carry_mass
        value: 30
        unit: кг
        note: Жёсткий лимит носимого. Всё сверх — только транспортом
      - key: inventory.mass_by_kind
        value:
          station: 60
          furniture: 40
          tool: 3
          gear: 2
          vehicle: 80
          material: 1
          consumable: 0.5
          money: 0.01
        unit: кг
        note: Умолчание массы по типу предмета. Грубое, но осмысленное там, где
          точный вес неважен; где важен — задаётся `mass:` у самого рецепта
        decision: D-146
      # Ноша (D-268): экзоскелет поднимает предел, рюкзак облегчает первые
      # килограммы — две разные ручки, они не конкурируют
      - key: inventory.exo_bonus
        value:
          Экзоскелет: 100
          Тяжёлый экзоскелет: 300
          Пироксисовый экзоскелет: 1000
        unit: кг
        note: Насколько надетый экзоскелет поднимает предел носимого. Работает,
          пока в руках есть заряженный аккумулятор; сел — это просто рама, которая
          сама весит. Слот один, поэтому два экзоскелета не наденешь
        decision: D-268
      - key: inventory.pack
        value:
          Корзина: {capacity: 8, factor: 0.9}
          Мешок: {capacity: 15, factor: 0.85}
          Простой рюкзак: {capacity: 20, factor: 0.8}
          Прочный рюкзак: {capacity: 35, factor: 0.7}
          Пироксисовый рюкзак: {capacity: 50, factor: 0.5}
        unit: кг и ×
        note: Рюкзак вмещает первые capacity килограммов ноши и множит их вес на
          factor — упаковка подразумевается, первые килограммы несутся в нём.
          Предел носимого он не поднимает — это дело экзоскелета
        decision: D-268
      - key: gear.exo_energy_per_hour
        value: 4
        unit: ед./ч
        note: Сколько заряда экзоскелет тянет за час ношения из аккумулятора в
          руках. Сел аккумулятор — экзоскелет не поднимает ничего
        decision: D-268
      - key: invent.recipe_slots
        value: 0
        note: Ноль означает «без ограничения» — лимит наказывал бы старожилов
      - key: quality.recycle_carryover
        value: 60
        unit: "%"
        note: Доля качества, переносимая при переработке предмета обратно в материалы
      - key: contract.registry_fee
        value: 1
        unit: ТК
        note: Записать договор в реестр (уровень 2). Дёшево намеренно
        decision: D-116
      - key: contract.rent_period
        value: 1
        unit: сутки
        note: Частота повторяющихся списаний — аренда, жалованье
        decision: D-116
      - key: contract.max_duration
        value: 30
        unit: суток
        note: Предельный срок договора. Дольше — перезаключать
        decision: D-116
      - key: contract.late_grace
        value: 6
        unit: часов
        note: Просрочка сверх срока, после которой фиксируется нарушение
        decision: D-116
      - key: contract.fee_level3
        value: 2
        unit: "% суммы"
        note: Комиссия эскроу-контракта с замораживанием капитала
      - key: city.foundation_cost
        value: 8000
        unit: ТК
        note: Оценка материалов и труда на основание города. Порог намеренно высок (D-023)
      # Доли — это и есть смысл слов устава «простое большинство» и «две трети»
      # (D-161). В коде их быть не может: движок читает написанное здесь
      - key: vote.thresholds
        value: {simple: 0.5, two_thirds: 0.667, unanimous: 1}
        unit: доля голосов
        note: Порог принятия по вариантам устава `law_threshold`. Простое большинство берётся строго больше доли, прочие — не меньше
        decision: D-161
      - key: vote.duration
        value: 24
        unit: ч
        note: "Сколько идёт голосование граждан. Часы, а не минуты: участвуют не только те, кто онлайн в момент созыва"
        decision: D-161
      - key: chat.net_group_limit
        value: 50
        unit: участников
        note: Предел групповой переписки в Сети
      - key: cheat.suspicion_sigma
        value: 3
        unit: σ
        note: Отклонение поведения, после которого аккаунт попадает в очередь проверки
      - key: cheat.action_sigma
        value: 3
        unit: σ
        note: То же для равномерности ритма действий
      - key: record.covert_rig_level
        value: 8
        unit: уровень лестницы
        note: С какого уровня рецептов доступно скрытое оснащение записи (D-081)
      - key: record.max_duration
        value: 30
        unit: минут
        note: Предел длительности одной записи
      - key: record.carrier_mass
        value: 2
        unit: кг
        note: Вес носителя записи

  # Реактор Предтеч (D-232): тепло распада без топлива и без людей. Выход
  # падает от появления Авроры в мире и к году реального времени доходит до
  # нуля — не выключатель, а угасание, видимое заранее
  - id: reactor
    title: Реактор Предтеч
    constants:
      - key: reactor.output
        value: 240
        unit: энергии в час
        note: Выход свежего реактора. Хватает на ТЭЦ Предтеч с запасом; в аккумуляторы не отдаётся — дармовой энергии на экспорт не бывает
        decision: D-232
      - key: reactor.lifetime
        value: 365
        unit: суток реального времени
        note: За сколько выход падает до нуля. Отсчёт — от момента, когда сид кладёт поверхность Авроры, а не от прилёта
        decision: D-232

  # Кислород (D-233, D-234): вторая шкала выживания, и только там, где
  # воздуха нет — в полёте и на Пироксисе. Терра и Аврора её не видят.
  # Числа выведены из одной цели: три месяца автономии на экипаж из четырёх
  - id: oxygen
    title: Кислород и автономия
    constants:
      - key: oxygen.crew_draw
        value: 0.1
        unit: ед./час на человека
        note: Дыхание на борту, где за бортом нет воздуха. 4 человека на 90 суток — 864 единицы кислорода — из баллонов на линии системы (D-288); электролизёр делает их из 8640 воды
        decision: D-234
      - key: oxygen.body_draw
        value: 0.5
        unit: ед./час
        note: "Дыхание снаружи, из баллона. Впятеро дороже бортового: работа тяжелее, и скафандр травит"
        decision: D-234
      - key: oxygen.cylinder_store
        value: 6
        unit: единиц
        note: Сколько держит «Кислородный баллон». При 0,5 в час — 12 часов снаружи, треть суток Пироксиса. Балансное число, движок его не читает — ёмкость даёт `store` баллона в килограммах, 12 кг при 2 кг за единицу (D-228, D-288)
        decision: D-234
      - key: oxygen.autonomy_target
        value: 90
        unit: суток реального времени
        note: Балансная цель, из которой выведены остальные числа группы. Не проверяется движком — проверяется симуляцией
        decision: D-234
      - key: oxygen.hydroponics_rate
        value: 0.02
        unit: ед./час на м² засеянной делянки
        note: Гидропоника дышит (D-288) — в тару на своей линии, пока растёт культура. Минимальная делянка 5 м² даёт 0,1 в час — дыхание одного человека; читается с волны 4
        decision: D-288

  # Тепло и мерзлота (D-231): узел либо тёплый, либо холодный, у тела —
  # теплозапас в часах. Числа стартовые: сутки Авроры — 33 часа, и без
  # утепления ночь под открытым небом тело не переживает
  - id: frost
    title: Мороз и тепло
    constants:
      - key: frost.reserve_max
        value: 6
        unit: часов
        note: Теплозапас тела без утепления. В холоде тает час за час, в тепле восстанавливается
        decision: D-231
      - key: frost.warm_rate
        value: 3
        unit: часов/час
        note: Насколько быстро теплозапас набирается в тёплом узле. Пустое тело греется два часа
        decision: D-231
      - key: frost.suit_k
        value:
          Утеплённый костюм: 3
        unit: "×"
        note: Во сколько раз надетое множит теплозапас. Ключ — класс вещи, как в inventory.exo_bonus
        decision: D-231
      - key: frost.warmer_hours
        value: 4
        unit: часов
        note: Сколько часов теплозапаса добавляет одна грелка. То, с чем уходят в разведку
        decision: D-231
      - key: frost.frozen_drain_k
        value: 2
        unit: "×"
        note: Во сколько раз замёрзший тратит больше выносливости на любую работу
        decision: D-231
      - key: frost.frozen_stamina
        value: 15
        unit: ед./час
        note: Выносливость, которую замёрзший жжёт просто на времени. Гибернация даёт 8 — в холоде сон не спасает
        decision: D-231
      - key: frost.plant_draw
        value: 60
        unit: энергии в час
        note: Расход ТЭЦ. Греет свой узел и соседние; угольная станция даёт 200 в час
        decision: D-231
      - key: frost.heater_draw
        value: 20
        unit: энергии в час
        note: Расход обогревателя. Греет только свой узел
        decision: D-231
      - key: frost.brazier_fuel_draw
        value: 2
        unit: ед./час
        note: Топлива в час у жаровни. Энергии не даёт — только тепло, и пула ей не нужно
        decision: D-231

  - id: pyroxis
    title: Пироксис
    constants:
      - key: pyroxis.eruption_period
        value: {min: 5, max: 14}
        unit: суток

          20 → 1,25 при ужатии планет 2026-09-10. Порог только выглядит
          абсолютным: он мерит долю планеты, стекающую через клетку, а вся
          планета ужалась в шестнадцать раз по площади. Оставить 20 км²
          значило бы требовать от реки четверть суши Терры вместо прежней
          шестидесятой — рек не осталось бы вовсе. Делится на те же
          шестнадцать — по площади, а не по радиусу, потому что водосбор и
          есть площадь: сеть рек выходит той же, что и была. 1,25 → 0,3125
          второй волной (D-329) — те же четыре, на которые ужата площадь.

          С D-329 порог мерит не площадь водосбора, а **расход** через клетку
          (`hydro.discharge`): ту же сумму, но взвешенную отдачей клетки и
          нормированную на среднее по суше. Единица у него осталась прежней и
          означает прежнее — «столько площади средней влажности», — а сухой
          водосбор реки больше не рождает. Той же мерой и тем же порогом
          решается, какие русла захватывают друг друга (`hydro.capture`,
          `terrain.capture_reach_m`): иначе захват резал бы гребни под
          русла, которых рекой не будет
        decision: 90-production/12
      - key: terrain.river_merge
        value: 0.5
        unit: доля суммы
        note: >-
          Что делает слияние с шириной: «если две реки вливаются в одну, то
          ширина получившейся — не сумма ширин входящих, а сумма ширин на
          0,5» (владелец 2026-09-11). Прежде ширина бралась у расхода по
          закону «множитель на корень из водосбора» (константа снята той же
          правкой), и две равные реки давали в полтора раза более широкую;
          теперь — ровно такую же.

          Считается по дереву стока (`hydro.widths`) с одной оговоркой, без
          которой правило съедает само себя: берётся **большее** из двух —
          самая широкая из впадающих или эта доля их суммы. У клетки реки
          впадающая чаще всего одна, и половина от одной ширины означала бы
          половину реки на каждом шаге вниз — всякая река сошла бы на нет
          через десяток клеток.

          Что из этого выходит, стоит сказать прямо: слияний по три и больше
          в одной клетке мало, а слияния по два ширину не меняют, — значит
          река почти всюду одной ширины, и это выбор, а не побочный эффект.
          Вернуть рост можно, подняв долю выше 0,5
        decision: 90-production/12

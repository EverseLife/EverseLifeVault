  # Реактор Предтеч (D-232): тепло распада без топлива и без людей. Выход
  # падает от появления Авроры в мире и к году реального времени доходит до
  # нуля — не выключатель, а угасание, видимое заранее
  - id: reactor
    title: Реактор Предтеч
    constants:
      - key: reactor.output
        value: 240
        unit: энергии в час
        note: Выход свежего реактора. Хватает на ТЭЦ Предтеч с запасом; в аккумуляторы не отдаётся — дармовой энергии на экспорт не бывает
        decision: D-232
      - key: reactor.lifetime
        value: 365
        unit: суток реального времени
        note: За сколько выход падает до нуля. Отсчёт — от момента, когда сид кладёт поверхность Авроры, а не от прилёта
        decision: D-232

  # Кислород (D-233, D-234): вторая шкала выживания, и только там, где
  # воздуха нет — в полёте и на Пироксисе. Терра и Аврора её не видят.
  # Числа выведены из одной цели: три месяца автономии на экипаж из четырёх
  - id: oxygen
    title: Кислород и автономия
    constants:
      - key: oxygen.crew_draw
        value: 0.1
        unit: ед./час на человека
        note: Дыхание на борту, где за бортом нет воздуха. 4 человека на 90 суток — 864 единицы кислорода — из баллонов на линии системы (D-288); электролизёр делает их из 9720 воды и отдаёт 1728 водорода (D-340)
        decision: D-234
      - key: oxygen.body_draw
        value: 0.5
        unit: ед./час
        note: "Дыхание снаружи, из баллона. Впятеро дороже бортового: работа тяжелее, и скафандр травит"
        decision: D-234
      - key: oxygen.cylinder_store
        value: 6
        unit: единиц
        note: Сколько держит «Кислородный баллон». При 0,5 в час — 12 часов снаружи, треть суток Пироксиса. Балансное число, движок его не читает — ёмкость даёт `store` баллона в килограммах, 12 кг при 2 кг за единицу (D-228, D-288)
        decision: D-234
      - key: oxygen.autonomy_target
        value: 90
        unit: суток реального времени
        note: Балансная цель, из которой выведены остальные числа группы. Не проверяется движком — проверяется симуляцией
        decision: D-234
      - key: oxygen.hydroponics_rate
        value: 0.02
        unit: ед./час на м² засеянной делянки
        note: Гидропоника дышит (D-288) — в запечатанном корпусе, в тару на линии установок своего отсека, пока растёт культура; площадь отсека считается один раз (D-340, OQ-171). Минимальная делянка 5 м² даёт 0,1 в час — дыхание одного человека
        decision: D-288

  # Тепло и мерзлота (D-231): узел либо тёплый, либо холодный, у тела —
  # теплозапас в часах. Числа стартовые: сутки Авроры — 33 часа, и без
  # утепления ночь под открытым небом тело не переживает
  - id: frost
    title: Мороз и тепло
    constants:
      - key: frost.reserve_max
        value: {frost: 12, heat: 6}
        unit: часов
        note: >-
          Теплозапас тела без утепления, свой у климата: у мерзлоты (Аврора) и
          у пекла (Пироксис, там — «запас прохлады»). В холоде тает час за час,
          в тепле восстанавливается. У мерзлоты удвоен с 6 до 12 под снег
          (D-338): бездорожье Авроры под снегом стало длиннее в полтора-два
          раза (`travel.snow_multiplier` — 2 на полном снегу), и переход,
          который укладывался в запас, укладывается и под снегом. Число своё и
          из множителя не выводится: перенастройка множителя запас не двигает.
          У пекла прежние 6 — снега там нет
        decision: D-338
      - key: frost.warm_hours
        value: 2
        unit: часов
        note: >-
          За сколько часов пустой теплозапас наполняется в тёплом узле — при
          любом потолке: у голого тела и в утеплённом костюме, у мерзлоты и у
          пекла. Было `frost.warm_rate` 3 часа в час — скорость, которая при
          запасе 6 давала те же два часа; когда запас мерзлоты удвоили (D-338),
          скорость удвоила бы и прогрев, и ключом стало время, а не скорость
        decision: D-338
      # Ключ — ИМЯ вещи, а не класс (как в inventory.exo_bonus): строка
      # «Скафандр: 3» загрузилась бы молча и не сделала ничего, поэтому оба
      # скафандра вписаны поимённо. Климата множитель не спрашивает: что
      # защищает, защищает и от мороза, и от пекла (D-348)
      - key: frost.suit_k
        value:
          Утеплённый костюм: 3
          Жаростойкий скафандр: 2
          Скафандр на пироксите: 3
        unit: "×"
        note: >-
          Во сколько раз надетое множит температурный запас — в любом климате.
          Костюм мерзлоты и пироксисовый скафандр равны втрое, обычный
          жаростойкий вдвое: скафандр держит температуру заодно с воздухом,
          а пироксисовая плита держит её лучше плиты теплозащитной. Слот один
          («тело»), так что множители не складываются — надето всегда одно
        decision: D-348
      - key: frost.warmer_hours
        value: 4
        unit: часов
        note: Сколько часов теплозапаса добавляет одна грелка. То, с чем уходят в разведку
        decision: D-231
      - key: frost.frozen_drain_k
        value: 2
        unit: "×"
        note: Во сколько раз замёрзший тратит больше выносливости на любую работу
        decision: D-231
      - key: frost.frozen_stamina
        value: {frost: 25, heat: 15}
        unit: ед./час
        note: >-
          Выносливость, которую замёрзший жжёт просто на времени, своя у
          климата. Гибернация даёт 8 — непрерывный сон в холоде не спасает
          (сон урывками — OQ-175). У мерзлоты поднята с 15 до 25 вместе с
          удвоенным теплозапасом (D-338): голое тело в холоде держится
          12 + 100/25 = 16 часов — меньше пол-суток Авроры (16,5 из 33),
          которыми группа мерит «ночь под открытым небом»; самой ночи мороз не
          знает. У пекла прежние 15
        decision: D-338
      - key: frost.plant_draw
        value: 60
        unit: энергии в час
        note: Расход ТЭЦ. Греет свой узел и соседние; угольная станция даёт 200 в час
        decision: D-231
      - key: frost.heater_draw
        value: 20
        unit: энергии в час
        note: Расход обогревателя. Греет только свой узел
        decision: D-231
      - key: frost.brazier_fuel_draw
        value: 2
        unit: ед./час
        note: Топлива в час у жаровни. Энергии не даёт — только тепло, и пула ей не нужно
        decision: D-231

  - id: pyroxis
    title: Пироксис
    constants:
      - key: pyroxis.eruption_period
        value: {min: 5, max: 14}
        unit: суток
        note: "Ритм планеты, а не катастрофа: извержения идут постоянно"
        decision: D-197
      - key: pyroxis.eruption_warning
        value: 6
        unit: часов
        note: Сигнал в затронутых узлах. Бесплатен и обязателен — это окно на отступление
        decision: D-197
      - key: pyroxis.nodes_shifted
        value: {min: 1, max: 4}
        unit: узлов
        note: Сколько узлов перестраивает одно извержение
      - key: pyroxis.edge_redraw_share
        value: 0.4
        unit: доля рёбер
        note: Какая доля путей затронутого узла перекраивается. Столько же шансов, что ляжет новый мост — планета берёт и даёт одним броском
        decision: D-197
      - key: pyroxis.vein_relocate_share
        value: 0.5
        unit: доля жил
        note: Сколько жил затронутого узла гаснет. Столько же зажигается по соседству
        decision: D-197
      # Прогноз сейсмолога отменён (D-235): его две константы убраны отсюда

  - id: aurora

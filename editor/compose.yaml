# Редактор рецептов. Запуск из корня вольта:
#
#   docker compose -f editor/compose.yaml up --build
#
# Открыть http://127.0.0.1:8765
#
# Правки идут прямо в файл вольта на диске: `/vault` — это bind mount, а не
# копия. Контейнер пишет в тот же `data/recipes.yaml`, что лежит здесь же, и
# git видит правку сразу.

services:
  vault-editor:
    build:
      context: .
    image: octoverse-vault-editor
    ports:
      # Только петля хоста: инструмент пишет в файлы, наружу ему незачем.
      - "127.0.0.1:8765:8765"
    volumes:
      # Сам вольт: редактор живёт внутри него, поэтому это каталог выше.
      # Путь переопределяется переменной OCTOVERSE_VAULT.
      - ${OCTOVERSE_VAULT:-..}:/vault
      # Бэкапы переживают пересоздание контейнера — иначе «Отменить правку»
      # забывала бы всё при каждом `up`.
      - ./backups:/backups
    # На Linux раскомментируйте, иначе файлы вольта станут принадлежать root:
    # user: "${UID:-1000}:${GID:-1000}"
    stop_grace_period: 2s

<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Рецепты Everse.Life</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:,">
</head>
<body>

<header class="bar">
  <div class="brand">
    <b>Вольт</b>
    <span class="path" id="source-path" title="что правит редактор"></span>
    <span class="badge stale" id="stale" hidden
          title="build/recipes.json в вольте старше data/recipes.yaml: серые числа справа — со времени прошлой сборки">не пересчитано</span>
  </div>
  <div class="seg tabs" id="tabs">
    <button data-tab="recipes" class="on">Рецепты</button>
    <button data-tab="food" title="блюда (D-119), съедобное и станции, на которых готовят">Еда</button>
    <button data-tab="stations">Станции</button>
    <button data-tab="buildings" title="типы зданий (D-218): состав на м², цена этажа, порча">Здания</button>
    <button data-tab="constants" title="все числа игры (D-065): по одному, с единицей, смыслом и решением">Константы</button>
    <button data-tab="world" title="раскладка стартового мира (D-243): узлы, дороги в секундах, станки, жилы">Мир</button>
  </div>
  <div class="actions">
    <button id="act-new" class="primary">+ рецепт</button>
    <button id="act-new-dish" class="primary" title="блюдо (D-119): расходник с пометкой «еда», входы — роли, готовится на очаге" hidden>+ блюдо</button>
    <button id="act-new-material" title="материал (D-215): вещь без рецепта — сырьё мира. Одна строка реестра, и «Алмаз» уже находится разведкой">+ материал</button>
    <button id="act-new-class" title="класс вещей (D-215): «любая из кирок», «любая кровать»">+ класс</button>
    <button id="act-new-building" class="primary" title="тип здания (D-218): свой состав на м² пола, свой рост цены этажа и своя скорость порчи" hidden>+ тип здания</button>
    <button id="act-new-constant" class="primary" title="константа (D-065): ключ, значение, единица, смысл, решение" hidden>+ константа</button>
    <button id="act-new-node" class="primary" title="узел мира (D-243): место, куда приходят и где стоят станки" hidden>+ узел</button>
    <span class="gap"></span>
    <button id="act-masses" title="пересчитать массы из входов (D-228) и показать, у кого вес переопределён вручную">Массы</button>
    <button id="act-check" title="tools/build.py --check: ничего не пишет, говорит о проблемах">Проверить</button>
    <button id="act-build" title="tools/build.py: пересобрать документы и build/*.json вольта">Собрать</button>
    <button id="act-undo" title="вернуть файлы к состоянию до последней правки (Ctrl+Z вне поля ввода)">Отменить</button>
  </div>
</header>

<main>
  <aside class="side list-side">
    <div class="search">
      <input id="search" type="search" placeholder="поиск: название, вход, станция" autocomplete="off">
    </div>
    <div class="filters" id="filters"></div>
    <div class="list" id="list"></div>
    <div class="counts" id="counts" title="что в файле сейчас"></div>
  </aside>

  <section class="canvas">
    <div class="canvas-bar">
      <div class="seg" id="mode">
        <button data-mode="focus" class="on">Фокус</button>
        <button data-mode="all">Вся лестница</button>
      </div>
      <label class="ctl recipes-only">вглубь
        <input id="depth-in" type="range" min="0" max="8" value="2">
        <output id="depth-in-out">2</output>
      </label>
      <label class="ctl recipes-only">вверх
        <input id="depth-out" type="range" min="0" max="8" value="1">
        <output id="depth-out-out">1</output>
      </label>
      <div class="spacer"></div>
      <button id="act-fit" title="вписать в экран">Вписать</button>
      <span class="hint" id="graph-hint"></span>
    </div>
    <div class="graph-wrap" id="graph-wrap">
      <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
      <!-- Лестницу зданий графом не покажешь: типы ни из чего друг друга не
           делают, они сравниваются. Поэтому у вкладки зданий на этом же месте
           таблица, а граф прячется. -->
      <div class="board" id="board" hidden></div>
      <!-- Мир — не лестница: это карта. Свой холст, потому что рисуется место,
           а не «из чего делается»: узлы там, где они стоят, и дороги в секундах. -->
      <div class="worldstage" id="worldstage" hidden></div>
    </div>
    <div class="legend" id="legend"></div>
  </section>

  <aside class="side edit-side" id="panel">
    <div class="empty">Выберите вещь слева или на графе.</div>
  </aside>
</main>

<footer class="console" id="console">
  <div class="console-bar">
    <span id="console-title">готово</span>
    <button id="console-toggle">свернуть</button>
  </div>
  <pre id="console-out"></pre>
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel">Отмена</button>
      <button id="modal-ok" class="danger">Да</button>
    </div>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Рецепты Everse.Life</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:,">
</head>
<body>

<header class="bar">
  <div class="brand">
    <b>Рецепты</b>
    <span class="path" id="source-path" title="что правит редактор"></span>
    <span class="badge stale" id="stale" hidden
          title="build/recipes.json в вольте старше data/recipes.yaml: серые числа справа — со времени прошлой сборки">числа не пересчитаны — соберите</span>
  </div>
  <div class="seg tabs" id="tabs">
    <button data-tab="recipes" class="on">Рецепты</button>
    <button data-tab="stations">Станции</button>
    <button data-tab="buildings" title="типы зданий (D-218): состав на м², цена этажа, порча">Здания</button>
  </div>
  <div class="counts" id="counts"></div>
  <div class="actions">
    <button id="act-new" class="primary">+ рецепт</button>
    <button id="act-new-material" title="материал (D-215): вещь без рецепта — сырьё мира. Одна строка реестра, и «Алмаз» уже находится разведкой">+ материал</button>
    <button id="act-new-class" title="класс вещей (D-215): «любая из кирок», «любая кровать»">+ класс</button>
    <button id="act-new-building" title="тип здания (D-218): свой состав на м² пола, свой рост цены этажа и своя скорость порчи" hidden>+ тип здания</button>
    <button id="act-check">Проверить</button>
    <button id="act-build">Собрать</button>
    <button id="act-undo" title="вернуть файл к состоянию до последней правки">Отменить правку</button>
  </div>
</header>

<main>
  <aside class="side list-side">
    <div class="search">
      <input id="search" type="search" placeholder="поиск: название, вход, станция" autocomplete="off">
    </div>
    <div class="filters" id="filters"></div>
    <div class="list" id="list"></div>
  </aside>

  <section class="canvas">
    <div class="canvas-bar">
      <div class="seg" id="mode">
        <button data-mode="focus" class="on">Фокус</button>
        <button data-mode="all">Вся лестница</button>
      </div>
      <label class="ctl recipes-only">вглубь
        <input id="depth-in" type="range" min="0" max="8" value="2">
        <output id="depth-in-out">2</output>
      </label>
      <label class="ctl recipes-only">вверх
        <input id="depth-out" type="range" min="0" max="8" value="1">
        <output id="depth-out-out">1</output>
      </label>
      <div class="spacer"></div>
      <button id="act-fit" title="вписать в экран">Вписать</button>
      <span class="hint" id="graph-hint"></span>
    </div>
    <div class="graph-wrap" id="graph-wrap">
      <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
      <!-- Лестницу зданий графом не покажешь: типы ни из чего друг друга не
           делают, они сравниваются. Поэтому у вкладки зданий на этом же месте
           таблица, а граф прячется. -->
      <div class="board" id="board" hidden></div>
    </div>
    <div class="legend" id="legend"></div>
  </section>

  <aside class="side edit-side" id="panel">
    <div class="empty">Выберите вещь слева или на графе.</div>
  </aside>
</main>

<footer class="console" id="console">
  <div class="console-bar">
    <span id="console-title">готово</span>
    <button id="console-toggle">свернуть</button>
  </div>
  <pre id="console-out"></pre>
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel">Отмена</button>
      <button id="modal-ok" class="danger">Да</button>
    </div>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
